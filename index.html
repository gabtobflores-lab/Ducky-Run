<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Spark Clicker</title>
<style>
  :root{--bg1:#1a1022;--bg2:#3a1a33;--ac:#ff9a3c;--ac2:#ffd27a;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--tx:#fff4e6;--dim:#c9a9b8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body.frenzy{background:linear-gradient(160deg,#2a0f1e,#6a2a10)}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #app{position:relative;display:flex;height:100%}
  #left{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 12px 10px}
  #top{text-align:center}
  #title{font-weight:900;letter-spacing:.25em;font-size:12px;color:var(--ac2);opacity:.8}
  #count{font-size:clamp(34px,7vw,58px);font-weight:900;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s}
  #count.bump{transform:scale(1.06)}
  #cname{font-size:15px;color:var(--dim);margin-top:-2px}
  #cps{font-size:14px;color:var(--ac2);font-weight:700;margin-top:2px}
  #buffs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:26px;margin-top:6px}
  .buff{background:linear-gradient(90deg,#ffb347,#ff6a3c);color:#2a0f1e;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;animation:pop .35s cubic-bezier(.3,1.8,.5,1);box-shadow:0 0 14px rgba(255,150,60,.6)}
  #zone{flex:1;min-height:150px;touch-action:manipulation;cursor:pointer}
  #foot{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--dim)}
  button{font:inherit;color:inherit;cursor:pointer}
  #foot button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
  #right{width:390px;max-width:45vw;display:flex;flex-direction:column;background:rgba(10,4,16,.55);border-left:1px solid var(--line);backdrop-filter:blur(6px)}
  #bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
  .tab{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-weight:800;font-size:13px}
  .tab.on{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a0f1e;border-color:transparent}
  .tab i{font-style:normal;background:#ff4d6d;color:#fff;border-radius:99px;padding:1px 6px;margin-left:4px;font-size:11px}
  #qty{display:flex;gap:4px;width:100%}
  #qty button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px}
  #qty button.on{border-color:var(--ac);color:var(--ac2)}
  #list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;transition:transform .12s,background .2s}
  .row.can{border-color:rgba(255,190,90,.5);background:rgba(255,170,60,.12);cursor:pointer}
  .row.can:hover{transform:translateX(-3px)}
  .row:not(.can){opacity:.62}
  .row.locked{opacity:.4;filter:grayscale(1)}
  .row.buy{animation:buy .4s}
  .ico{font-size:28px;width:40px;text-align:center;flex:none}
  .meta{flex:1;min-width:0}
  .nm{font-weight:800;font-size:15px}
  .sub{font-size:12px;color:var(--dim)}
  .cost{font-size:13px;font-weight:800;color:#ffd27a}
  .row:not(.can) .cost{color:#ff8a8a}
  .own{font-size:26px;font-weight:900;opacity:.35;min-width:34px;text-align:right}
  .ucard .nm{font-size:14px}
  #toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9;pointer-events:none;align-items:center}
  .toast{background:rgba(20,8,30,.92);border:1px solid var(--ac);padding:8px 16px;border-radius:12px;font-weight:700;font-size:14px;animation:toast 3.6s forwards;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .spark{position:fixed;width:74px;height:74px;margin:-37px 0 0 -37px;z-index:8;cursor:pointer;animation:sparkIn .5s cubic-bezier(.3,1.8,.5,1),float 3s ease-in-out infinite .5s;filter:drop-shadow(0 0 16px #ffc24a)}
  .spark.out{animation:sparkOut .3s forwards}
  #codebar{display:flex;align-items:center;gap:8px;margin:8px auto 0;width:100%;max-width:340px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 14px;transition:border-color .2s,box-shadow .2s}
  #codebar:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,154,60,.18),0 0 18px rgba(255,154,60,.25)}
  #codebar span{opacity:.7}
  #codein{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:14px;letter-spacing:.12em;text-transform:lowercase}
  #codein::placeholder{color:var(--dim);letter-spacing:.05em;opacity:.7}
  #codebar button{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a0f1e;border:0;border-radius:99px;padding:7px 16px;font-weight:800;font-size:13px}
  #codebar.bad{animation:shake .35s;border-color:#ff6a6a}
  #codebar.ok{border-color:#7dff9a;box-shadow:0 0 22px rgba(125,255,154,.45)}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  #modal{position:fixed;inset:0;z-index:20;background:rgba(10,4,16,.75);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
  #modal .box{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  #modal h2{margin:0 0 4px;text-align:center;color:var(--ac2);font-size:20px}
  #ascend{margin-top:6px;background:linear-gradient(90deg,var(--ac2),var(--ac));color:#2a0f1e;border:0;border-radius:99px;padding:6px 18px;font-weight:900;font-size:13px;letter-spacing:.1em;animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 22px var(--ac)}}
  #flash{position:fixed;inset:0;background:#fff;z-index:30;pointer-events:none;opacity:0}
  #flash.go{animation:flash 1.2s}
  @keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  #modal .btns{display:flex;gap:8px}
  #modal .btns button{flex:1;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;font-weight:800}
  #modal .btns button.go{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a0f1e;border:0}
  @keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
  @keyframes buy{0%{transform:scale(1)}30%{transform:scale(1.04);background:rgba(255,220,120,.3)}100%{transform:scale(1)}}
  @keyframes toast{0%{opacity:0;transform:translateY(-20px) scale(.9)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  @keyframes sparkIn{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1)}}
  @keyframes sparkOut{to{transform:scale(2);opacity:0}}
  @keyframes float{50%{transform:translateY(-8px) rotate(8deg)}}
  @media(max-width:760px){
    #app{flex-direction:column}
    #left{flex:none;height:46%;padding-bottom:4px}
    #right{width:100%;max-width:none;flex:1;border-left:0;border-top:1px solid var(--line);min-height:0}
    #foot{display:none}
    #count{font-size:34px}
    #cname,#title{display:none}
    .toast{font-size:12px;padding:6px 12px}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <section id="left">
    <div id="top">
      <div id="title">SPARK CLICKER</div>
      <div id="count">0</div>
      <div id="cname">cookies</div>
      <div id="cps">per second: 0</div>
      <div id="buffs"></div>
      <button id="ascend" style="display:none">✦ ASCEND</button>
    </div>
    <div id="zone"></div>
    <div id="foot"><span id="ach"></span><button id="snd">Sound on</button><button id="save">Save</button><button id="reset">Reset</button></div>
    <form id="codebar" autocomplete="off"><span>🔑</span><input id="codein" maxlength="20" placeholder="enter secret code" autocapitalize="off" spellcheck="false"><button type="submit">Redeem</button></form>
  </section>
  <section id="right">
    <div id="bar">
      <button class="tab on" data-t="b">Buildings</button>
      <button class="tab" data-t="u">Upgrades<i id="ucount">0</i></button>
      <div id="qty"><button data-q="1" class="on">Buy 1</button><button data-q="10">Buy 10</button><button data-q="100">Buy 100</button></div>
    </div>
    <div id="list"></div>
  </section>
</div>
<div id="flash"></div>
<div id="toasts"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const SUF = ['', 'K', 'M', 'B', 'T', 'QA', 'QI', 'SX', 'SP', 'OC', 'NO', 'DC', 'UD', 'DD', 'TD'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1e3) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
  const i = Math.min(SUF.length - 1, Math.floor(Math.log10(n) / 3)), v = n / Math.pow(1000, i);
  return v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + SUF[i];
}
const fmtBig = n => n < 1e6 ? Math.floor(n).toLocaleString() : fmt(n);

// ---------- data ----------
const B = [
  { n: 'Cursor', base: 15, cps: .1, ico: '👆' }, { n: 'Grandma', base: 100, cps: 1, ico: '👵' },
  { n: 'Farm', base: 1100, cps: 8, ico: '🌾' }, { n: 'Mine', base: 12000, cps: 47, ico: '⛏️' },
  { n: 'Factory', base: 130000, cps: 260, ico: '🏭' }, { n: 'Bank', base: 1.4e6, cps: 1400, ico: '🏦' },
  { n: 'Temple', base: 2e7, cps: 7800, ico: '🛕' }, { n: 'Wizard Tower', base: 3.3e8, cps: 44000, ico: '🧙' },
  { n: 'Portal', base: 5.1e9, cps: 260000, ico: '🌀' }, { n: 'Time Machine', base: 7.5e10, cps: 1.6e6, ico: '⏳' },
];
const TIERS = [[1, 10, 'Sturdy'], [5, 50, 'Polished'], [25, 500, 'Enchanted'], [50, 5000, 'Legendary'], [100, 50000, 'Mythic']];
const U = [];
B.forEach((b, i) => TIERS.forEach(([cnt, mult, adj], k) => U.push({
  id: `b${i}_${k}`, name: `${adj} ${b.n}s`, ico: b.ico, cost: b.base * mult,
  desc: i ? `${b.n}s are twice as efficient. (needs ${cnt} ${b.n}${cnt > 1 ? 's' : ''})` : `Cursors and clicks are twice as efficient. (needs ${cnt})`,
  req: () => S.owned[i] >= cnt, fx: m => { m.b[i] *= 2; }
})));
[['Steady Hand', 100], ['Iron Finger', 500], ['Titanium Tap', 5e3], ['Diamond Digit', 5e4], ['Quantum Poke', 5e6], ['Cosmic Click', 5e8]].forEach(([name, cost], k) =>
  U.push({ id: 'c' + k, name, ico: '🖱️', cost, desc: 'Clicking is twice as powerful.', req: () => S.total >= cost / 4, fx: m => { m.click *= 2; } }));
[['Helping Hand', 1e4, .02], ['Mighty Mitt', 5e5, .04], ['Godly Grip', 5e7, .08]].forEach(([name, cost, p], k) =>
  U.push({ id: 'p' + k, name, ico: '💪', cost, desc: `Each click also gives ${p * 100}% of your cookies per second.`, req: () => S.total >= cost / 4, fx: m => { m.pct += p; } }));
[['Sparkle Glaze', 5e3], ['Sugar Aura', 5e5], ['Frosting Halo', 5e7], ['Starlight Icing', 5e9], ['Nova Sprinkles', 5e11]].forEach(([name, cost], k) =>
  U.push({ id: 'g' + k, name, ico: '✨', cost, desc: 'Cookie production +10% for everything.', req: () => S.total >= cost / 4, fx: m => { m.glob += .1; } }));
[['Lucky Charm', 1e5], ['Four-Leaf Clover', 1e7]].forEach(([name, cost], k) =>
  U.push({ id: 'l' + k, name, ico: '🍀', cost, desc: 'Golden sparks appear more often and last longer.', req: () => S.total >= cost / 4, fx: m => { m.spark *= .7; m.life *= 1.4; } }));

// ---------- state ----------
let S = { cookies: 0, total: 0, clicks: 0, owned: B.map(() => 0), upg: {}, ach: {}, seen: {}, last: Date.now(), sparks: 0, sound: true, skin: 'logo', codes: {}, ascents: 0, omega: false, inf: false };
try { const d = JSON.parse(localStorage.sparkClicker || 'null'); if (d) S = Object.assign(S, d); } catch (e) {}
if (S.inf) { S.cookies = Infinity; S.total = Infinity; }
const THEMES = [
  { n: 'Coral', ac: '#ff9a3c', ac2: '#ffd27a', b1: '#1a1022', b2: '#3a1a33', g: ['#f2a583', '#d97757', '#bf5a3a'], rgb: '255,150,60' },
  { n: 'Violet', ac: '#b58cff', ac2: '#e0ccff', b1: '#120d2a', b2: '#2a1a55', g: ['#c9b0ff', '#9b6cf0', '#7448c8'], rgb: '160,120,255' },
  { n: 'Teal', ac: '#2ee6c4', ac2: '#a8fff0', b1: '#0a1f26', b2: '#12403f', g: ['#8ff5e0', '#27c9a8', '#14917a'], rgb: '46,230,196' },
  { n: 'Rose', ac: '#ff6fa8', ac2: '#ffc2da', b1: '#240e1a', b2: '#4a1a36', g: ['#ffb0cf', '#f0568f', '#c43068'], rgb: '255,110,170' },
  { n: 'Gold', ac: '#ffc233', ac2: '#ffe89a', b1: '#1e1a0a', b2: '#3d3210', g: ['#ffe38a', '#f2b01e', '#c98400'], rgb: '255,194,51' },
  { n: 'Ice', ac: '#5cc8ff', ac2: '#bfe9ff', b1: '#0b1830', b2: '#12315a', g: ['#b5e6ff', '#4fb4f0', '#2c82c4'], rgb: '90,200,255' },
  { n: 'Lime', ac: '#a6e64a', ac2: '#dcffa0', b1: '#101c0e', b2: '#25401a', g: ['#d4f58f', '#8fd23a', '#5a9a1e'], rgb: '166,230,74' },
];
let T = THEMES[0];
function applyTheme() {
  T = THEMES[S.ascents % THEMES.length]; const st = document.documentElement.style;
  st.setProperty('--ac', T.ac); st.setProperty('--ac2', T.ac2); st.setProperty('--bg1', T.b1); st.setProperty('--bg2', T.b2);
}
applyTheme();
let M, cpsBase = 0, buffs = [], qty = 1, tab = 'b';
function recalc() {
  M = { b: B.map(() => 1), click: 1, pct: 0, glob: 0, spark: 1, life: 1 };
  U.forEach(u => { if (S.upg[u.id]) u.fx(M); });
  M.glob += S.ascents * .1;
  cpsBase = B.reduce((s, b, i) => s + S.owned[i] * b.cps * M.b[i], 0) * (1 + M.glob);
}
const cpsMul = () => buffs.reduce((m, b) => m * (b.cps || 1), 1);
const clickMul = () => buffs.reduce((m, b) => m * (b.click || 1), 1);
const cps = () => cpsBase * cpsMul();
const clickVal = () => (M.click * M.b[0] + cps() * M.pct) * clickMul();
function cost(i, n) { const r = 1.15; return Math.ceil(B[i].base * Math.pow(r, S.owned[i]) * (Math.pow(r, n) - 1) / (r - 1)); }
recalc();
{ const away = Math.min((Date.now() - S.last) / 1000, 8 * 3600);
  if (away > 60 && cpsBase > 0) { const g = cpsBase * away * .5; S.cookies += g; S.total += g; setTimeout(() => toast(`Welcome back! Your bakers made ${fmt(g)} cookies while you were away.`), 400); } }

// ---------- audio ----------
let ac, lastTick = 0;
function beep(f, d = .08, type = 'sine', vol = .05, slide = 0) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), ac.currentTime + d);
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// ---------- UI ----------
function toast(msg) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; const tb = $('#toasts'); tb.appendChild(d); while (tb.children.length > 3) tb.firstChild.remove();
  setTimeout(() => d.remove(), 3700);
}
const list = $('#list');
const bRows = B.map((b, i) => {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="ico">${b.ico}</div><div class="meta"><div class="nm"></div><div class="sub"></div><div class="cost"></div></div><div class="own"></div>`;
  r.onclick = () => buyB(i, r); return r;
});
const bBox = document.createElement('div'), uBox = document.createElement('div');
[bBox, uBox].forEach(x => { x.style.cssText = 'display:flex;flex-direction:column;gap:8px'; });
bRows.forEach(r => bBox.appendChild(r)); list.append(bBox, uBox); uBox.hidden = true;
function setTab(t) {
  tab = t; bBox.hidden = t !== 'b'; uBox.hidden = t !== 'u';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  $('#qty').style.display = t === 'b' ? 'flex' : 'none'; list.scrollTop = 0;
}
document.querySelectorAll('.tab').forEach(x => x.onclick = () => setTab(x.dataset.t));
document.querySelectorAll('#qty button').forEach(x => x.onclick = () => {
  qty = +x.dataset.q; document.querySelectorAll('#qty button').forEach(y => y.classList.toggle('on', y === x));
});
function flash(el) { el.classList.remove('buy'); void el.offsetWidth; el.classList.add('buy'); }
function buyB(i, el) {
  const c = cost(i, qty);
  if (S.cookies < c) { beep(150, .1, 'square', .03); return; }
  S.cookies -= c; S.owned[i] += qty; recalc(); flash(el); beep(500 + i * 40, .15, 'triangle', .06, 300);
  const z = zoneRect(); burst(z.cx, z.cy, 14, R * .8);
}
let uKey = '';
function renderUpgrades() {
  const vis = U.filter(u => !S.upg[u.id] && u.req()).sort((a, b) => a.cost - b.cost);
  const key = vis.map(u => u.id).join();
  $('#ucount').textContent = vis.filter(u => S.cookies >= u.cost).length; $('#ucount').style.display = vis.some(u => S.cookies >= u.cost) ? '' : 'none';
  if (key !== uKey) {
    uKey = key; uBox.innerHTML = '';
    if (!vis.length) uBox.innerHTML = '<div class="sub" style="text-align:center;padding:24px">No upgrades yet. Keep baking!</div>';
    vis.forEach(u => {
      const r = document.createElement('div'); r.className = 'row ucard'; r.dataset.id = u.id;
      r.innerHTML = `<div class="ico">${u.ico}</div><div class="meta"><div class="nm">${u.name}</div><div class="sub">${u.desc}</div><div class="cost">🍪 ${fmt(u.cost)}</div></div>`;
      r.onclick = () => { if (S.cookies < u.cost) return beep(150, .1, 'square', .03); S.cookies -= u.cost; S.upg[u.id] = 1; recalc(); beep(700, .25, 'sine', .07, 600); uKey = ''; const z = zoneRect(); burst(z.cx, z.cy, 24, R); toast(`Bought ${u.name}!`); };
      uBox.appendChild(r);
    });
  }
  uBox.querySelectorAll('.ucard').forEach(r => r.classList.toggle('can', S.cookies >= (U.find(u => u.id === r.dataset.id) || {}).cost));
}
function renderUI() {
  const cEl = $('#count'); cEl.textContent = fmtBig(S.cookies);
  $('#cname').textContent = Math.floor(S.cookies) === 1 ? 'cookie' : 'cookies';
  $('#cps').textContent = 'per second: ' + fmt(cps());
  B.forEach((b, i) => {
    const r = bRows[i], c = cost(i, qty);
    if (S.cookies >= b.base * .5 || S.owned[i]) S.seen[i] = 1;
    const seen = S.seen[i];
    r.classList.toggle('locked', !seen); r.classList.toggle('can', !!seen && S.cookies >= c);
    r.querySelector('.nm').textContent = seen ? b.n : '???';
    r.querySelector('.ico').style.filter = seen ? '' : 'brightness(0)';
    r.querySelector('.sub').textContent = seen ? `each makes ${fmt(b.cps * M.b[i] * (1 + M.glob))}/s` : 'keep baking to discover';
    r.querySelector('.cost').textContent = seen ? '🍪 ' + fmt(c) : '';
    r.querySelector('.own').textContent = S.owned[i] || '';
  });
  $('#ascend').style.display = S.omega ? '' : 'none';
  renderUpgrades();
  const bd = $('#buffs'); bd.innerHTML = buffs.map(b => `<span class="buff">${b.name} ${Math.ceil(b.left)}s</span>`).join('');
  document.body.classList.toggle('frenzy', buffs.some(b => b.cps > 1));
  $('#ach').textContent = `🏆 ${Object.keys(S.ach).length}/${A.length}`;
  document.title = fmtBig(S.cookies) + ' cookies - Spark Clicker';
}

// ---------- achievements ----------
const A = [];
[1, 100, 1e3, 1e4, 1e5, 1e6, 1e7, 1e8, 1e9, 1e10, 1e12].forEach(n => A.push({ id: 't' + n, name: `Baked ${fmt(n)} cookies`, ok: () => S.total >= n }));
[100, 1e3, 1e4, 5e4].forEach(n => A.push({ id: 'k' + n, name: `Clicked ${fmt(n)} times`, ok: () => S.clicks >= n }));
B.forEach((b, i) => [1, 10, 25, 50, 100].forEach(n => A.push({ id: `o${i}_${n}`, name: `${n} ${b.n}${n > 1 ? 's' : ''}`, ok: () => S.owned[i] >= n })));
A.push({ id: 'sp1', name: 'Caught a golden spark', ok: () => S.sparks >= 1 }, { id: 'sp2', name: 'Spark collector (13)', ok: () => S.sparks >= 13 });
function checkAch() { A.forEach(a => { if (!S.ach[a.id] && a.ok()) { S.ach[a.id] = 1; toast('🏆 ' + a.name); beep(880, .3, 'triangle', .06, 500); } }); }

// ---------- golden spark ----------
let sparkT = rand(30, 60);
function spawnSpark() {
  const d = document.createElement('div'); d.className = 'spark';
  d.innerHTML = '<svg viewBox="-50 -50 100 100" width="74" height="74"><defs><radialGradient id="gs"><stop offset="0" stop-color="#fff6c0"/><stop offset=".6" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff8a1c"/></radialGradient></defs><path d="M0-46 12-14 46-12 18 8 28 44 0 24-28 44-18 8-46-12-12-14Z" fill="url(#gs)" stroke="#fff3b0" stroke-width="3" stroke-linejoin="round"/></svg>';
  d.style.left = rand(90, innerWidth - 90) + 'px'; d.style.top = rand(120, innerHeight - 120) + 'px';
  let gone = false; const kill = () => { if (gone) return; gone = true; d.classList.add('out'); setTimeout(() => d.remove(), 300); };
  d.addEventListener('pointerdown', e => {
    e.stopPropagation(); if (gone) return; kill(); S.sparks++;
    burst(e.clientX, e.clientY, 30, 120, '#ffd24a');
    const r = Math.random();
    if (r < .45) { buffs.push({ name: 'FRENZY x7', left: 30 * M.life, cps: 7 }); toast('Frenzy! Production x7 for 30s'); }
    else if (r < .85) { const g = Math.min(S.cookies * .15, cpsBase * 900) + 13; S.cookies += g; S.total += g; toast(`Lucky! +${fmt(g)} cookies`); floatText(e.clientX, e.clientY, '+' + fmt(g), true); }
    else { buffs.push({ name: 'CLICK FRENZY x10', left: 15 * M.life, click: 10 }); toast('Click frenzy! Clicks x10 for 15s'); }
    beep(600, .5, 'sine', .08, 900);
  });
  document.body.appendChild(d); setTimeout(kill, 12000 * M.life);
}

// ---------- canvas ----------
const cv = $('#bg'), ctx = cv.getContext('2d'), zone = $('#zone');
let dpr = 1, R = 100, t = 0;
function resize() { dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
addEventListener('resize', resize); resize();
function zoneRect() { const r = zone.getBoundingClientRect(); R = Math.max(50, Math.min(r.width, r.height) * .34); return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; }
let sc = 1, scv = 0, rot = 0, wob = 0, wobv = 0, hover = false, parts = [], floats = [], rain = [], ripples = [];
const chips = [[-.38, -.3, .13], [.1, -.5, .11], [.42, -.15, .14], [-.1, .02, .12], [.3, .35, .12], [-.45, .25, .11], [.0, .55, .1], [-.2, -.62, .08], [.62, .1, .07]];
function burst(x, y, n, sp, col) {
  for (let i = 0; i < n; i++) { const a = rand(0, 6.283), v = rand(sp * .4, sp * 2.2); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: rand(.5, 1), max: 1, r: rand(2, 5), rot: rand(0, 6), col: col || (S.skin === 'choc' ? (Math.random() < .5 ? '#b8782f' : '#6b3a14') : (Math.random() < .5 ? T.g[1] : T.g[0])) }); }
}
function floatText(x, y, txt, big) { floats.push({ x: x + rand(-14, 14), y, txt, life: 1, big }); }
function doClick(x, y) {
  const v = clickVal(); S.cookies += v; S.total += v; S.clicks++;
  const z = zoneRect(); sc = .9; scv = 2.2; wobv += rand(-2.5, 2.5);
  burst(x, y, 7, 130); floatText(x, y - 10, '+' + fmt(v));
  ripples.push({ x: z.cx, y: z.cy, r: R * .9, life: 1 });
  const now = performance.now(); if (now - lastTick > 40) { lastTick = now; beep(rand(300, 380), .06, 'triangle', .04, 120); }
  const c = $('#count'); c.classList.add('bump'); setTimeout(() => c.classList.remove('bump'), 70);
}
zone.addEventListener('pointerdown', e => {
  e.preventDefault(); const z = zoneRect();
  if (Math.hypot(e.clientX - z.cx, e.clientY - z.cy) <= R * 1.08 * sc) doClick(e.clientX, e.clientY);
});
zone.addEventListener('pointermove', e => { const z = zoneRect(); hover = Math.hypot(e.clientX - z.cx, e.clientY - z.cy) <= R * 1.08; zone.style.cursor = hover ? 'pointer' : 'default'; });
zone.addEventListener('pointerleave', () => hover = false);
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); const z = zoneRect(); doClick(z.cx + rand(-R / 2, R / 2), z.cy + rand(-R / 2, R / 2)); } });

function cookiePath(r) { ctx.beginPath(); for (let a = 0; a <= 6.2832; a += .05) { const rr = r * (.95 + .05 * Math.cos(a * 14)); a ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(rr, 0); } ctx.closePath(); }
const RAYS = [1, .82, .95, .74, 1, .86, .78, .97, .84, 1, .76, .92];
function drawChoc(r, big) {
  cookiePath(r);
  const g = ctx.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r * 1.05);
  g.addColorStop(0, '#f8c874'); g.addColorStop(.55, '#dc9140'); g.addColorStop(1, '#a85a1c');
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = big ? 5 : 1.5; ctx.strokeStyle = '#7a3d10'; ctx.stroke();
  chips.forEach(([x, y, k]) => {
    ctx.fillStyle = '#4a2511'; ctx.beginPath(); ctx.ellipse(x * r, y * r, k * r * 1.15, k * r * .9, x * 3, 0, 7); ctx.fill();
    if (big) { ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.ellipse(x * r - k * r * .3, y * r - k * r * .3, k * r * .35, k * r * .2, 0, 0, 7); ctx.fill(); }
  });
  if (big) { ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.ellipse(-r * .35, -r * .6, r * .4, r * .17, -.6, 0, 7); ctx.fill(); }
}
function drawCookie(r, big) {
  if (S.skin === 'choc') return drawChoc(r, big);
  const g = ctx.createRadialGradient(-r * .3, -r * .35, r * .05, 0, 0, r * 1.05);
  g.addColorStop(0, T.g[0]); g.addColorStop(.55, T.g[1]); g.addColorStop(1, T.g[2]);
  ctx.strokeStyle = g; ctx.fillStyle = g; ctx.lineCap = 'round';
  const w = r * .135;
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * 6.2832 + (i % 3 - 1) * .035, L = r * (RAYS[i] * .98 + (big ? Math.sin(t * 2.2 + i * 1.3) * .04 : 0)) - w / 2;
    ctx.lineWidth = w * (.8 + RAYS[i] * .45); ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .1, Math.sin(a) * r * .1); ctx.lineTo(Math.cos(a) * L, Math.sin(a) * L); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * .2, 0, 7); ctx.fill();
  if (big) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(-r * .2, -r * .24, r * .14, r * .07, -.7, 0, 7); ctx.fill(); }
}
function loop(now) {
  const dt = Math.min(.05, (now - (loop.l || now)) / 1000); loop.l = now; t += dt;
  const c = cps(); S.cookies += c * dt; S.total += c * dt;
  buffs.forEach(b => b.left -= dt); buffs = buffs.filter(b => b.left > 0);
  sparkT -= dt; if (sparkT <= 0) { spawnSpark(); sparkT = rand(60, 130) * M.spark; }
  const z = zoneRect();
  // springs
  scv += ((hover ? 1.045 : 1) - sc) * 260 * dt - scv * 14 * dt; sc += scv * dt;
  wobv += -wob * 90 * dt - wobv * 7 * dt; wob += wobv * dt; rot += dt * .12;
  // passive crumbs + rain
  if (Math.random() < Math.min(14, Math.log10(1 + c) * 3) * dt) { const a = rand(0, 6.283); burst(z.cx + Math.cos(a) * R, z.cy + Math.sin(a) * R, 3, 90); }
  if (Math.random() < Math.min(14, Math.log10(1 + c) * 2.4) * dt) rain.push({ x: rand(0, innerWidth), y: -40, vy: rand(70, 160), r: rand(10, 26), rot: rand(0, 6), vr: rand(-1.5, 1.5) });
  rain.forEach(p => { p.y += p.vy * dt; p.rot += p.vr * dt; }); rain = rain.filter(p => p.y < innerHeight + 40);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.rot += dt * 8; p.life -= dt * 1.2; }); parts = parts.filter(p => p.life > 0);
  floats.forEach(f => { f.y -= (f.big ? 50 : 70) * dt; f.life -= dt * .9; }); floats = floats.filter(f => f.life > 0);
  ripples.forEach(r => { r.r += 280 * dt; r.life -= dt * 2.2; }); ripples = ripples.filter(r => r.life > 0);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.globalAlpha = .35;
  rain.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); drawCookie(p.r, false); ctx.restore(); });
  ctx.globalAlpha = 1;
  // glow
  const frenzy = buffs.some(b => b.cps > 1), ga = Math.min(.5, .12 + Math.log10(1 + c) * .04) + (frenzy ? .25 : 0) + Math.sin(t * 2) * .03;
  const gg = ctx.createRadialGradient(z.cx, z.cy, R * .4, z.cx, z.cy, R * 1.9);
  gg.addColorStop(0, frenzy ? `rgba(255,200,80,${ga})` : `rgba(${T.rgb},${ga})`); gg.addColorStop(1, `rgba(${T.rgb},0)`);
  ctx.fillStyle = gg; ctx.fillRect(z.cx - R * 2, z.cy - R * 2, R * 4, R * 4);
  // rays when frenzy
  if (frenzy) { ctx.save(); ctx.translate(z.cx, z.cy); ctx.rotate(t * .4); ctx.fillStyle = 'rgba(255,220,120,.07)'; for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R * 2.4, -R * .22); ctx.lineTo(R * 2.4, R * .22); ctx.fill(); } ctx.restore(); }
  ripples.forEach(r => { ctx.strokeStyle = `rgba(255,220,150,${r.life * .6})`; ctx.lineWidth = 4 * r.life; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); });
  // cookie
  ctx.save(); ctx.translate(z.cx, z.cy + Math.sin(t * 1.6) * R * .02);
  ctx.save(); ctx.translate(R * .05, R * .1); ctx.scale(sc, sc * .98); ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0, R * .08, R * .55, R * .55, 0, 0, 7); ctx.fill(); ctx.restore();
  ctx.rotate(rot * .6 + wob); ctx.scale(sc, sc); drawCookie(R, true); ctx.restore();
  // cursors ring
  const nc = Math.min(S.owned[0], 60);
  for (let i = 0; i < nc; i++) {
    const a = i / nc * 6.2832 + t * .25, rr = R * 1.3 + Math.max(0, Math.sin(t * 2.2 + i * 1.7)) * R * -.12;
    ctx.save(); ctx.translate(z.cx + Math.cos(a) * rr, z.cy + Math.sin(a) * rr); ctx.rotate(a + Math.PI / 2 + Math.PI);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; const s = Math.max(6, R * .09);
    ctx.beginPath(); ctx.moveTo(0, -s * 1.6); ctx.lineTo(s, s); ctx.lineTo(0, s * .4); ctx.lineTo(-s, s); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r * .7, p.r * 2, p.r * 1.4); ctx.restore(); });
  ctx.globalAlpha = 1; ctx.textAlign = 'center';
  floats.forEach(f => { ctx.globalAlpha = Math.min(1, f.life * 1.6); ctx.font = `900 ${f.big ? 30 : 22}px system-ui,sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,10,20,.8)'; ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = f.big ? '#ffd24a' : '#fff4e6'; ctx.fillText(f.txt, f.x, f.y); });
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}

// ---------- secret codes ----------
const CODES = { megaspark: 'mega', goldenpick: 'pick', chocochip: 'skin', cookiegalaxy: 'bank', omegacookie: 'omega' };
function modal(html) { $('#mbox').innerHTML = html; $('#modal').style.display = 'flex'; }
function tryCode(txt) {
  const k = Object.keys(CODES).find(c => txt.endsWith(c)); if (!k) return false;
  const type = CODES[k];
  if (type === 'skin') {
    S.skin = S.skin === 'choc' ? 'logo' : 'choc'; toast(S.skin === 'choc' ? 'Secret unlocked: chocolate chip cookie!' : 'Back to the starburst'); beep(660, .4, 'sine', .08, 600);
    const z = zoneRect(); burst(z.cx, z.cy, 40, R * 1.2); return true;
  }
  if (type === 'omega') {
    S.omega = true; S.inf = true; S.cookies = Infinity; S.total = Infinity; U.forEach(u => { S.upg[u.id] = 1; }); recalc(); uKey = '';
    toast('MEGA SECRET! Every upgrade, infinite cookies. You can now ASCEND.'); beep(150, 1.5, 'sawtooth', .08, 1800);
    const z = zoneRect(); burst(z.cx, z.cy, 120, R * 2.2, '#fff'); return true;
  }
  if (S.codes[type]) { toast('You already used that code'); return true; }
  S.codes[type] = 1;
  if (type === 'bank') {
    S.cookies += 999e15; S.total += 999e15; toast('SUPER SECRET! +999QA cookies'); beep(200, 1.2, 'sawtooth', .08, 1400);
    const z = zoneRect(); burst(z.cx, z.cy, 90, R * 2, '#ffd24a'); floatText(z.cx, z.cy - R, '+999QA', true); return true;
  }
  if (type === 'mega') {
    buffs.push({ name: 'MEGA x99999', left: 60, cps: 99999, click: 99999 }); toast('Secret code! Everything x99999 for 60s'); beep(300, .8, 'sawtooth', .07, 900);
    const z = zoneRect(); burst(z.cx, z.cy, 60, R * 1.6, '#ffd24a');
  } else {
    const left = U.filter(u => !S.upg[u.id]), near = left.filter(u => u.cost <= Math.max(5e4, S.total * 20)), pool = (near.length >= 3 ? near : left.sort((a, b) => a.cost - b.cost).slice(0, 6)).sort(() => Math.random() - .5).slice(0, 3);
    if (!pool.length) { toast('You already own every upgrade!'); return true; }
    modal('<h2>Secret code! Pick a free upgrade</h2>' + pool.map(u => `<div class="row can" data-id="${u.id}"><div class="ico">${u.ico}</div><div class="meta"><div class="nm">${u.name}</div><div class="sub">${u.desc}</div></div></div>`).join(''));
    $('#mbox').querySelectorAll('.row').forEach(r => r.onclick = () => {
      const u = U.find(x => x.id === r.dataset.id); S.upg[u.id] = 1; recalc(); uKey = ''; $('#modal').style.display = 'none';
      toast('Free upgrade: ' + u.name); beep(700, .3, 'sine', .08, 700); const z = zoneRect(); burst(z.cx, z.cy, 30, R);
    });
  }
  return true;
}
let codeBuf = '';
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.key.length !== 1 || !/[a-z0-9]/i.test(e.key)) return;
  codeBuf = (codeBuf + e.key.toLowerCase()).slice(-16); if (tryCode(codeBuf)) codeBuf = '';
});
$('#codein').addEventListener('keydown', e => e.stopPropagation());
$('#codebar').addEventListener('submit', e => {
  e.preventDefault(); const inp = $('#codein'), bar = $('#codebar'), v = inp.value.toLowerCase().trim(); if (!v) return;
  const ok = tryCode(v); inp.value = ''; if (!ok) toast('Nothing happened...');
  bar.classList.remove('bad', 'ok'); void bar.offsetWidth; bar.classList.add(ok ? 'ok' : 'bad'); setTimeout(() => bar.classList.remove('bad', 'ok'), 900);
  if (ok) inp.blur();
});

// ---------- ascend ----------
$('#ascend').onclick = () => {
  const nx = THEMES[(S.ascents + 1) % THEMES.length];
  modal(`<h2>Ascend to the ${nx.n} realm?</h2><div class="sub" style="text-align:center">You start over with 0 cookies, buildings and upgrades. The world changes color, and every ascension gives +10% production forever.<br>Ascensions so far: ${S.ascents}</div><div class="btns"><button id="mno">Not yet</button><button class="go" id="myes">Ascend</button></div>`);
  $('#mno').onclick = () => { $('#modal').style.display = 'none'; };
  $('#myes').onclick = () => {
    $('#modal').style.display = 'none';
    S.ascents++; S.cookies = 0; S.total = 0; S.clicks = 0; S.owned = B.map(() => 0); S.upg = {}; S.seen = {}; S.inf = false; buffs = []; uKey = '';
    recalc(); applyTheme(); const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    const z = zoneRect(); burst(z.cx, z.cy, 100, R * 2, T.g[0]); beep(300, 1, 'sine', .09, 1200); toast(`Ascended! Welcome to the ${T.n} realm (+${S.ascents * 10}% production)`);
    setTab('b'); save();
  };
};

// ---------- save / misc ----------
function save() { S.last = Date.now(); try { const o = Object.assign({}, S); if (S.inf) { o.cookies = 0; o.total = 0; } localStorage.sparkClicker = JSON.stringify(o); } catch (e) {} }
$('#save').onclick = () => { save(); toast('Game saved'); };
let sure = 0;
$('#reset').onclick = e => {
  if (!sure) { sure = 1; e.target.textContent = 'Really?'; setTimeout(() => { sure = 0; e.target.textContent = 'Reset'; }, 3000); return; }
  try { localStorage.removeItem('sparkClicker'); } catch (err) {} S.last = Date.now(); location.reload();
};
$('#snd').onclick = e => { S.sound = !S.sound; e.target.textContent = S.sound ? 'Sound on' : 'Sound off'; };
$('#snd').textContent = S.sound ? 'Sound on' : 'Sound off';
setInterval(save, 10000); addEventListener('beforeunload', save);
setInterval(renderUI, 100); setInterval(checkAch, 700);
setTab('b'); renderUI(); requestAnimationFrame(loop);
</script>
