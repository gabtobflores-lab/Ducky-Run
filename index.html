<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Spark Clicker</title>
<style>
  :root{--bg1:#1a1022;--bg2:#3a1a33;--ac:#ff9a3c;--ac2:#ffd27a;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--tx:#fff4e6;--dim:#c9a9b8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body.frenzy{background:linear-gradient(160deg,#2a0f1e,#6a2a10)}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #app{position:relative;display:flex;height:100%}
  #left{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 12px 10px}
  #top{text-align:center}
  #title{font-weight:900;letter-spacing:.25em;font-size:12px;color:var(--ac2);opacity:.8}
  #count{font-size:clamp(34px,7vw,58px);font-weight:900;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s}
  #count.bump{transform:scale(1.06)}
  #cname{font-size:15px;color:var(--dim);margin-top:-2px}
  #cps{font-size:14px;color:var(--ac2);font-weight:700;margin-top:2px}
  #buffs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:26px;margin-top:6px}
  .buff{background:linear-gradient(90deg,#ffb347,#ff6a3c);color:#2a0f1e;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;animation:pop .35s cubic-bezier(.3,1.8,.5,1);box-shadow:0 0 14px rgba(255,150,60,.6)}
  #zone{flex:1;min-height:150px;touch-action:manipulation;cursor:pointer}
  #foot{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--dim)}
  button{font:inherit;color:inherit;cursor:pointer}
  #foot button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
  #right{width:390px;max-width:45vw;display:flex;flex-direction:column;background:rgba(10,4,16,.55);border-left:1px solid var(--line);backdrop-filter:blur(6px)}
  #bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
  .tab{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-weight:800;font-size:13px}
  .tab.on{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a0f1e;border-color:transparent}
  .tab i{font-style:normal;background:#ff4d6d;color:#fff;border-radius:99px;padding:1px 6px;margin-left:4px;font-size:11px}
  #qty{display:flex;gap:4px;width:100%}
  #qty button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px}
  #qty button.on{border-color:var(--ac);color:var(--ac2)}
  #list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;transition:transform .12s,background .2s}
  .row.can{border-color:rgba(255,190,90,.5);background:rgba(255,170,60,.12);cursor:pointer}
  .row.can:hover{transform:translateX(-3px)}
  .row:not(.can){opacity:.62}
  .row.locked{opacity:.4;filter:grayscale(1)}
  .row.buy{animation:buy .4s}
  .ico{font-size:28px;width:40px;text-align:center;flex:none}
  .meta{flex:1;min-width:0}
  .nm{font-weight:800;font-size:15px}
  .sub{font-size:12px;color:var(--dim)}
  .cost{font-size:13px;font-weight:800;color:#ffd27a}
  .row:not(.can) .cost{color:#ff8a8a}
  .own{font-size:26px;font-weight:900;opacity:.35;min-width:34px;text-align:right}
  .ucard .nm{font-size:14px}
  #toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none;align-items:center}
  .toast{background:rgba(20,8,30,.92);border:1px solid var(--ac);padding:8px 16px;border-radius:12px;font-weight:700;font-size:14px;animation:toast 3.6s forwards;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .spark{position:fixed;width:74px;height:74px;margin:-37px 0 0 -37px;z-index:8;cursor:pointer;animation:sparkIn .5s cubic-bezier(.3,1.8,.5,1),float 3s ease-in-out infinite .5s;filter:drop-shadow(0 0 16px #ffc24a)}
  .spark.out{animation:sparkOut .3s forwards}
  #codebar{display:flex;align-items:center;gap:8px;margin:8px auto 0;width:100%;max-width:340px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 14px;transition:border-color .2s,box-shadow .2s}
  #codebar:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,154,60,.18),0 0 18px rgba(255,154,60,.25)}
  #codebar span{opacity:.7}
  #codein{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:14px;letter-spacing:.12em;text-transform:lowercase}
  #codein::placeholder{color:var(--dim);letter-spacing:.05em;opacity:.7}
  #codebar button{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a0f1e;border:0;border-radius:99px;padding:7px 16px;font-weight:800;font-size:13px}
  #codebar{position:relative}
  #codebook{background:none;border:0;padding:0 2px;font-size:16px;opacity:.8}
  #codelist{position:absolute;left:0;right:0;bottom:calc(100% + 8px);display:none;flex-direction:column;gap:2px;max-height:55vh;overflow-y:auto;background:rgba(14,6,22,.96);border:1px solid var(--ac);border-radius:14px;padding:8px;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:left}
  #codelist.open{display:flex}
  #codelist h4{margin:2px 6px 4px;font-size:11px;letter-spacing:.16em;color:var(--ac2)}
  .cd{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;cursor:pointer;color:#fff4e6}
  .cd:hover{background:rgba(255,255,255,.08)}
  .cd b{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ac2);white-space:nowrap}
  .cd span{font-size:11px;color:#c9a9b8}
  .cd i{margin-left:auto;font-style:normal;font-size:11px;color:#7dff9a}
  #ascend.off{animation:none;opacity:.55;filter:grayscale(.4)}
  #codebar.bad{animation:shake .35s;border-color:#ff6a6a}
  #codebar.ok{border-color:#7dff9a;box-shadow:0 0 22px rgba(125,255,154,.45)}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  #modal{position:fixed;inset:0;z-index:20;background:rgba(10,4,16,.75);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
  #modal .box{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  #modal h2{margin:0 0 4px;text-align:center;color:var(--ac2);font-size:20px}
  #ascend{margin-top:6px;background:linear-gradient(90deg,var(--ac2),var(--ac));color:#2a0f1e;border:0;border-radius:99px;padding:6px 18px;font-weight:900;font-size:13px;letter-spacing:.1em;animation:glow 2s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 22px var(--ac)}}
  #flash{position:fixed;inset:0;background:#fff;z-index:30;pointer-events:none;opacity:0}
  #flash.go{animation:flash 1.2s}
  @keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  #modal .btns{display:flex;gap:8px}
  #modal .btns button{flex:1;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;font-weight:800}
  #modal .btns button.go{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a0f1e;border:0}
  @keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
  @keyframes buy{0%{transform:scale(1)}30%{transform:scale(1.04);background:rgba(255,220,120,.3)}100%{transform:scale(1)}}
  @keyframes toast{0%{opacity:0;transform:translateY(-20px) scale(.9)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  @keyframes sparkIn{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1)}}
  @keyframes sparkOut{to{transform:scale(2);opacity:0}}
  @keyframes float{50%{transform:translateY(-8px) rotate(8deg)}}
  #bossbar{margin:6px auto 0;max-width:300px}
  #bosslbl{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ac2);margin-bottom:3px}
  #bossfill{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #bossfill i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .2s}
  #boost{font-size:11px;font-weight:800;color:var(--ac2);letter-spacing:.08em;margin-top:4px;min-height:0}
  #left{touch-action:none}
  #glare{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 38%,#fff 0%,#fffbe0 45%,#ffe9a0 100%);transition:opacity .25s}
  body.sun{--tx:#3a2a00;--dim:#7a6420;--card:rgba(255,255,255,.55);--line:rgba(140,100,0,.3)}
  body.space{--bg1:#02030f;--bg2:#0b1240;--ac:#7ab8ff;--ac2:#d6e8ff;--card:rgba(120,170,255,.08);--line:rgba(140,180,255,.2)}
  body.sun #list,body.space #list{padding-bottom:84px}
  #dimctl{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));z-index:32;width:min(88vw,340px);display:none;align-items:center;gap:10px;background:rgba(20,10,0,.9);color:#ffe9b0;padding:8px 14px;border-radius:99px;font-weight:800;font-size:12px;letter-spacing:.08em;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #dimctl input{flex:1;accent-color:#ffb020;min-width:0}
  #menu{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;background:linear-gradient(160deg,var(--bg1),var(--bg2));text-align:center;padding:20px 20px max(40px,10vh);transition:opacity .7s}
  #menu.hide{opacity:0;pointer-events:none}
  #mcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #menu>:not(canvas){position:relative}
  #mtitle{font-weight:900;letter-spacing:.22em;font-size:clamp(26px,7vw,48px);color:var(--ac2);text-shadow:0 4px 0 rgba(0,0,0,.35)}
  #msub{color:var(--dim);font-size:14px}
  #mplay{margin-top:8px;background:linear-gradient(180deg,var(--ac2),var(--ac));color:#2a0f1e;border:0;border-radius:99px;padding:14px 60px;font-weight:900;font-size:22px;letter-spacing:.22em;animation:glow 2s ease-in-out infinite;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  #mplay:active{transform:scale(.96)}
  #mstat{font-size:12px;color:var(--dim)}
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;display:none;touch-action:none}
  #cinebtn{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;display:none;background:#fff6dc;color:#5a3010;border:0;border-radius:99px;padding:12px 28px;font-weight:900;font-size:16px;letter-spacing:.06em;box-shadow:0 8px 30px rgba(255,200,100,.5);animation:fadein 1.5s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media(max-width:760px){
    #app{flex-direction:column;padding-top:env(safe-area-inset-top)}
    #left{flex:none;height:46%;padding:8px 10px 6px}
    #title,#cname{display:none}
    #count{font-size:32px}
    #cps{font-size:12px;margin-top:0}
    #buffs{min-height:0;margin-top:2px;gap:4px}
    .buff{font-size:10px;padding:2px 8px}
    #zone{min-height:100px}
    #foot{font-size:11px;gap:6px;margin-top:2px}
    #foot button{padding:3px 9px;font-size:11px}
    #codebar{margin-top:5px;max-width:none;padding:2px 2px 2px 12px}
    #codein{font-size:13px}
    #codebar button{padding:6px 12px;font-size:12px}
    #ascend{padding:4px 14px;font-size:11px;margin-top:3px}
    #bossbar{margin-top:3px}
    #right{width:100%;max-width:none;flex:1;border-left:0;border-top:1px solid var(--line);min-height:0;padding-bottom:env(safe-area-inset-bottom)}
    #bar{padding:6px;gap:5px}
    .tab{padding:7px 4px;font-size:12px}
    #qty button{padding:4px;font-size:11px}
    #list{padding:6px;gap:6px}
    .row{padding:6px 8px;gap:8px;border-radius:10px}
    .ico{font-size:22px;width:30px}
    .nm{font-size:14px}.sub{font-size:11px}.cost{font-size:12px}
    .own{font-size:20px;min-width:26px}
    .toast{font-size:12px;padding:6px 12px;max-width:92vw;text-align:center}
    #toasts{top:max(6px,env(safe-area-inset-top))}
    #modal h2{font-size:17px}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <section id="left">
    <div id="top">
      <div id="title">SPARK CLICKER</div>
      <div id="count">0</div>
      <div id="cname">cookies</div>
      <div id="cps">per second: 0</div>
      <div id="bossbar" style="display:none"><div id="bosslbl"></div><div id="bossfill"><i></i></div></div>
      <div id="boost"></div>
      <div id="buffs"></div>
      <button id="ascend" style="display:none">✦ ASCEND</button>
    </div>
    <div id="zone"></div>
    <div id="foot"><span id="ach"></span><button id="snd">Sound on</button><button id="save">Save</button><button id="reset">Reset</button></div>
    <form id="codebar" autocomplete="off"><span>🔑</span><div id="codelist"></div><input id="codein" maxlength="20" placeholder="enter secret code" autocapitalize="off" spellcheck="false"><button type="button" id="codebook" title="All codes">📜</button><button type="submit">Redeem</button></form>
  </section>
  <section id="right">
    <div id="bar">
      <button class="tab on" data-t="b">Buildings</button>
      <button class="tab" data-t="u">Upgrades<i id="ucount">0</i></button>
      <div id="qty"><button data-q="1" class="on">Buy 1</button><button data-q="10">Buy 10</button><button data-q="100">Buy 100</button></div>
    </div>
    <div id="list"></div>
  </section>
</div>
<div id="glare"></div>
<div id="dimctl"><span>☀</span><input type="range" id="dim" min="10" max="100" value="100" aria-label="Brightness"><span id="dimv">100%</span></div>
<div id="menu"><canvas id="mcv"></canvas><div id="mtitle">SPARK CLICKER</div><div id="msub">tap the cookie. fill the world.</div><button id="mplay">BAKE</button><div id="mstat"></div></div>
<canvas id="fx"></canvas>
<button id="cinebtn">Keep baking ✦</button>
<div id="flash"></div>
<div id="toasts"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const SUF = ['', 'K', 'M', 'B', 'T', 'QA', 'QI', 'SX', 'SP', 'OC', 'NO', 'DC', 'UD', 'DD', 'TD'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n >= 1e48) { const e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(2) + 'E' + e; }
  if (n < 1e3) return n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n).toString();
  const i = Math.min(SUF.length - 1, Math.floor(Math.log10(n) / 3)), v = n / Math.pow(1000, i);
  return v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + SUF[i];
}
const fmtBig = n => n < 1e6 ? Math.floor(n).toLocaleString() : fmt(n);

// ---------- data ----------
const B = [
  { n: 'Cursor', base: 15, cps: .1, ico: '👆' }, { n: 'Grandma', base: 100, cps: 1, ico: '👵' },
  { n: 'Farm', base: 1100, cps: 8, ico: '🌾' }, { n: 'Mine', base: 12000, cps: 47, ico: '⛏️' },
  { n: 'Factory', base: 130000, cps: 260, ico: '🏭' }, { n: 'Bank', base: 1.4e6, cps: 1400, ico: '🏦' },
  { n: 'Temple', base: 2e7, cps: 7800, ico: '🛕' }, { n: 'Wizard Tower', base: 3.3e8, cps: 44000, ico: '🧙' },
  { n: 'Portal', base: 5.1e9, cps: 260000, ico: '🌀' }, { n: 'Time Machine', base: 7.5e10, cps: 1.6e6, ico: '⏳' },
];
const TIERS = [[1, 10, 'Sturdy'], [5, 50, 'Polished'], [25, 500, 'Enchanted'], [50, 5000, 'Legendary'], [100, 50000, 'Mythic']];
const U = [];
B.forEach((b, i) => TIERS.forEach(([cnt, mult, adj], k) => U.push({
  id: `b${i}_${k}`, name: `${adj} ${b.n}s`, ico: b.ico, cost: b.base * mult,
  desc: i ? `${b.n}s are twice as efficient. (needs ${cnt} ${b.n}${cnt > 1 ? 's' : ''})` : `Cursors and clicks are twice as efficient. (needs ${cnt})`,
  req: () => S.owned[i] >= cnt, fx: m => { m.b[i] *= 2; }
})));
[['Steady Hand', 100], ['Iron Finger', 500], ['Titanium Tap', 5e3], ['Diamond Digit', 5e4], ['Quantum Poke', 5e6], ['Cosmic Click', 5e8]].forEach(([name, cost], k) =>
  U.push({ id: 'c' + k, name, ico: '🖱️', cost, desc: 'Clicking is twice as powerful.', req: () => S.total >= cost / 4, fx: m => { m.click *= 2; } }));
[['Helping Hand', 1e4, .02], ['Mighty Mitt', 5e5, .04], ['Godly Grip', 5e7, .08]].forEach(([name, cost, p], k) =>
  U.push({ id: 'p' + k, name, ico: '💪', cost, desc: `Each click also gives ${p * 100}% of your cookies per second.`, req: () => S.total >= cost / 4, fx: m => { m.pct += p; } }));
[['Sparkle Glaze', 5e3], ['Sugar Aura', 5e5], ['Frosting Halo', 5e7], ['Starlight Icing', 5e9], ['Nova Sprinkles', 5e11]].forEach(([name, cost], k) =>
  U.push({ id: 'g' + k, name, ico: '✨', cost, desc: 'Cookie production +10% for everything.', req: () => S.total >= cost / 4, fx: m => { m.glob += .1; } }));
[['Lucky Charm', 1e5], ['Four-Leaf Clover', 1e7]].forEach(([name, cost], k) =>
  U.push({ id: 'l' + k, name, ico: '🍀', cost, desc: 'Golden sparks appear more often and last longer.', req: () => S.total >= cost / 4, fx: m => { m.spark *= .7; m.life *= 1.4; } }));

// ---------- state ----------
let S = { cookies: 0, total: 0, clicks: 0, owned: B.map(() => 0), upg: {}, ach: {}, seen: {}, last: Date.now(), sparks: 0, sound: true, skin: 'logo', codes: {}, ascents: 0, omega: false, inf: false, boss: 0, bossTotal: 0, won: 0, cine: '', boostN: 0, sunDone: 0 };
try { const d = JSON.parse(localStorage.sparkClicker || 'null'); if (d) S = Object.assign(S, d); } catch (e) {}
if (S.inf) { S.cookies = Infinity; S.total = Infinity; }
const THEMES = [
  { n: 'Coral', ac: '#ff9a3c', ac2: '#ffd27a', b1: '#1a1022', b2: '#3a1a33', g: ['#f2a583', '#d97757', '#bf5a3a'], rgb: '255,150,60' },
  { n: 'Violet', ac: '#b58cff', ac2: '#e0ccff', b1: '#120d2a', b2: '#2a1a55', g: ['#c9b0ff', '#9b6cf0', '#7448c8'], rgb: '160,120,255' },
  { n: 'Teal', ac: '#2ee6c4', ac2: '#a8fff0', b1: '#0a1f26', b2: '#12403f', g: ['#8ff5e0', '#27c9a8', '#14917a'], rgb: '46,230,196' },
  { n: 'Rose', ac: '#ff6fa8', ac2: '#ffc2da', b1: '#240e1a', b2: '#4a1a36', g: ['#ffb0cf', '#f0568f', '#c43068'], rgb: '255,110,170' },
  { n: 'Gold', ac: '#ffc233', ac2: '#ffe89a', b1: '#1e1a0a', b2: '#3d3210', g: ['#ffe38a', '#f2b01e', '#c98400'], rgb: '255,194,51' },
  { n: 'Ice', ac: '#5cc8ff', ac2: '#bfe9ff', b1: '#0b1830', b2: '#12315a', g: ['#b5e6ff', '#4fb4f0', '#2c82c4'], rgb: '90,200,255' },
  { n: 'Lime', ac: '#a6e64a', ac2: '#dcffa0', b1: '#101c0e', b2: '#25401a', g: ['#d4f58f', '#8fd23a', '#5a9a1e'], rgb: '166,230,74' },
];
const BOSS = [null, { target: 1e9, K: 100, name: 'THE HOLLOW COOKIE' }, { target: 1e12, K: 400, name: 'THE CHROMATIC ONE' }, { target: 1e15, K: 2000, name: 'THE SUN' }];
const BOSS1 = { n: 'Hollow', ac: '#ff3355', ac2: '#ff9aa8', b1: '#080000', b2: '#2a0008', g: ['#ff7a8a', '#ff2b45', '#8a0a1c'], rgb: '255,40,60' };

  once('menu', 18.6, () => { S.sunDone = 1; S.boss = 0; S.bossTotal = 0; S.skin = 'angel'; dimV = 1; document.body.style.setProperty('--b', 1); recalc(); applyTheme(); uKey = ''; showMenu(true); save(); });
  if (T0 > 18.6) { ctx.fillStyle = `rgba(255,255,255,${1 - ease((T0 - 18.6) / 2.4)})`; ctx.fillRect(0, 0, W, H); }
  if (T0 > 21) { endCine(); toast('The angel left a halo on your cookie.'); }
}

// ---------- the sun fights back ----------
const STARS = Array.from({ length: 150 }, () => ({ x: rand(0, 1), y: rand(0, 1), r: rand(.5, 1.8), p: rand(0, 6) }));
const PLANETS = [[.34, '#b8b0a8', 3, 1.9], [.42, '#e8c070', 4.5, 1.5], [.5, '#4aa3ff', 5, 1.2], [.58, '#d9573a', 4, 1], [.7, '#d8a86a', 9, .6], [.8, '#e6d09a', 7.5, .45], [.9, '#8fe3e8', 6, .32], [.98, '#3f5fe0', 6, .25]];
function syncDim() { $('#dim').value = Math.round(dimV * 100); $('#dimv').textContent = Math.round(dimV * 100) + '%'; document.body.style.setProperty('--b', dimV); }
['pointerdown', 'touchstart'].forEach(ev => $('#dim').addEventListener(ev, () => { dimDrag = true; }));
['pointerup', 'pointercancel', 'touchend', 'touchcancel'].forEach(ev => addEventListener(ev, () => { dimDrag = false; }));
function sunTick(dt) {
  if (!dimDrag) { dimV = Math.min(1, dimV + dt * .06); syncDim(); }
  flareT -= dt;
  if (flareT <= 0) { flareT = rand(9, 16); dimV = Math.min(1, dimV + .35); syncDim(); toast('SOLAR FLARE! The sun is getting brighter!'); beep(90, .5, 'sawtooth', .1, 300); }
  if (dimV > SAFE) { const k = (dimV - SAFE) / (1 - SAFE); S.bossTotal = Math.max(0, S.bossTotal - BOSS[3].target * (.0015 + .02 * k) * dt); }
}
function drawSpace(z) {
  const b = clamp01((dimV - .1) / .9), vis = Math.pow(1 - clamp01((dimV - .1) / .5), 1.3), r = document.getElementById('zone').getBoundingClientRect();
  if (vis <= 0.01) return;
  ctx.save();
  STARS.forEach(q => { ctx.globalAlpha = vis * (.35 + .65 * Math.abs(Math.sin(t * .8 + q.p))); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(q.x * innerWidth, q.y * innerHeight, q.r, 0, 7); ctx.fill(); });
  const av = Math.min(r.width / 2, innerWidth * .46) * .97;
  ctx.translate(z.cx, z.cy); ctx.globalAlpha = vis;
  PLANETS.forEach(([f, col, rad, sp], i) => {
    const rx = av * f, ry = rx * .38;
    ctx.strokeStyle = 'rgba(160,190,255,.14)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, 7); ctx.stroke();
    const a = t * sp * .35 + i * 1.7, x = Math.cos(a) * rx, y = Math.sin(a) * ry, pr = rad * Math.max(.7, Math.min(1.6, av / 200));
    if (i === 5) { ctx.strokeStyle = 'rgba(230,208,154,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y, pr * 1.9, pr * .6, -.3, 0, 7); ctx.stroke(); }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, pr, 0, 7); ctx.fill();
  });
  ctx.restore();
}

// ---------- code book ----------
const CODE_INFO = [
  ['megaspark', 'x99999 on everything for 60s (once)', 'mega'], ['goldenpick', 'pick 1 of 3 free upgrades (once)', 'pick'],
  ['chocochip', 'switch cookie look', 'skin'], ['cookiegalaxy', '+999QA cookies (once)', 'bank'],
  ['omegacookie', 'every upgrade + infinite cookies, lets you ascend', 'omega'],
];
function renderCodes() {
  const el = $('#codelist'), lock = S.boss || S.cine;
  el.innerHTML = `<h4>SECRET CODES${lock ? '  (sealed by the boss)' : ''}</h4>` + CODE_INFO.map(([c, d, k]) => `<div class="cd" data-c="${c}"><b>${c}</b><span>${d}</span>${S.codes[k] ? '<i>used</i>' : ''}</div>`).join('') + '<div class="cd"><b>↑ ↓ ← →</b><span>swipe/press on the cookie: permanent x999, stacks</span></div>';
  el.querySelectorAll('.cd[data-c]').forEach(r => r.onclick = () => { $('#codein').value = r.dataset.c; el.classList.remove('open'); });
}
$('#codebook').onclick = e => { e.stopPropagation(); const el = $('#codelist'); if (!el.classList.contains('open')) renderCodes(); el.classList.toggle('open'); };
addEventListener('pointerdown', e => { if (!e.target.closest('#codelist') && e.target.id !== 'codebook') $('#codelist').classList.remove('open'); });
// ---------- save / misc ----------
let resetting = false;
function save() { if (resetting) return; S.last = Date.now(); try { const o = Object.assign({}, S); if (S.inf) { o.cookies = 0; o.total = 0; } localStorage.sparkClicker = JSON.stringify(o); } catch (e) {} }
$('#save').onclick = () => { save(); toast('Game saved'); };
let sure = 0;
$('#reset').onclick = e => {
  if (!sure) { sure = 1; e.target.textContent = 'Really?'; setTimeout(() => { sure = 0; e.target.textContent = 'Reset'; }, 3000); return; }
  try { localStorage.removeItem('sparkClicker'); } catch (err) {} S.last = Date.now(); resetting = true; location.reload();
};
$('#snd').onclick = e => { S.sound = !S.sound; e.target.textContent = S.sound ? 'Sound on' : 'Sound off'; };
$('#snd').textContent = S.sound ? 'Sound on' : 'Sound off';
setInterval(save, 10000); addEventListener('beforeunload', save);
setInterval(renderUI, 100); setInterval(checkAch, 700);
setTab('b'); renderUI(); requestAnimationFrame(loop);
if (S.cine) startCine(S.cine); else if (S.ascents >= 5 && !S.won && !S.boss) startCine('win'); else if (S.ascents >= 15 && S.won && !S.sunDone && !S.boss) startCine('sunwarn'); else showMenu(true);
</script>
