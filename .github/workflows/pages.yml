# Copies site/ (marketing page and privacy policy) to the gh-pages branch, which GitHub Pages serves.
name: Website
on:
  push:
    branches: [claude/ducky-run-game]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd site && touch .nojekyll && git init -q -b gh-pages && git add -A
          git -c user.name="Mirror Drop" -c user.email="actions@users.noreply.github.com" commit -qm "Website"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
