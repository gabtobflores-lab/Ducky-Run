# Builds the iPhone app for a real phone with the newest Xcode, unsigned, as MirrorDrop.ipa,
# and puts it on the "phone" release so it can be installed with Sideloadly (free Apple ID) on a Mac whose Xcode is too old.
name: Phone build
on:
  push:
    branches: [claude/ducky-run-game]
    paths: ['app-update/**', 'xcode/**', '.github/workflows/phone-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$NEWEST" ] && sudo xcode-select -s "$NEWEST/Contents/Developer"; xcodebuild -version
      - name: Assemble and build for iPhone
        run: |
          set -o pipefail
          mkdir -p build && cp -R xcode build/proj
          cp app-update/MirrorDropApp.swift app-update/index.html app-update/aurora.mp4 build/proj/MirrorDrop/
          cp -R app-update/LaunchBalls.imageset build/proj/MirrorDrop/Assets.xcassets/
          [ -d app-update/AppIcon-Gold.appiconset ] && cp -R app-update/AppIcon-Gold.appiconset build/proj/MirrorDrop/Assets.xcassets/
          cd build/proj
          xcodebuild -project MirrorDrop.xcodeproj -target MirrorDrop -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | grep -E "error:|BUILD" | tail -30
          mkdir -p ../ipa/Payload && cp -R build/Release-iphoneos/MirrorDrop.app ../ipa/Payload/
          cd ../ipa && zip -qry ../MirrorDrop.ipa Payload && ls -la ../MirrorDrop.ipa
      - name: Publish to the "phone" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view phone >/dev/null 2>&1 || gh release create phone --prerelease --title "Mirror Drop for iPhone (test build)" --notes "Install MirrorDrop.ipa with Sideloadly. Built automatically from the newest version."
          gh release upload phone build/MirrorDrop.ipa --clobber
