<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mirror Drop</title>
<style>
  /* ---------- design system ---------- */
  :root{
    --ink:#2b2d42; --ink-2:rgba(43,45,66,.62); --ink-3:rgba(43,45,66,.38);
    --pink:#ff6b81; --pink-hi:#ff8c9d; --pink-lo:#ec4f6a;
    --teal:#2ec4d6; --teal-hi:#5fd6e3; --teal-lo:#1aa9bc;
    --gold:#e9a23b; --gold-hi:#ffc867;
    --paper:#f6f1ea; --card:rgba(255,255,255,.74);
    --r-card:20px; --r-pill:999px;
    --sh-card:0 1px 0 rgba(255,255,255,.9) inset,0 6px 20px rgba(43,45,66,.07),0 1px 3px rgba(43,45,66,.05);
    --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
    --sc:var(--teal);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;height:100dvh;background:var(--paper);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  canvas#c{display:block;width:100%;height:100%}
  button{font:inherit;color:inherit}

  /* screens + transitions */
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;overflow-y:auto;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));text-align:center}
  .screen.on{display:flex;animation:in .26s var(--ease) both}
  .screen.out{display:flex;animation:out .18s ease-in both;pointer-events:none}
  #pause,#over{background:rgba(246,241,234,.80);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  @keyframes in{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes out{from{opacity:1}to{opacity:0;transform:scale(.99)}}

  /* type */
  .logo{margin:0;font-size:clamp(40px,12vw,60px);font-weight:900;letter-spacing:.02em;line-height:.95;display:flex;gap:.22em;flex-wrap:wrap;justify-content:center}
  .logo span{background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px rgba(43,45,66,.08))}
  .logo .p{background-image:linear-gradient(180deg,var(--pink-hi),var(--pink) 55%,var(--pink-lo))}
  .logo .c{background-image:linear-gradient(180deg,var(--teal-hi),var(--teal) 55%,var(--teal-lo))}
  .sub{font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin-top:-8px}
  .big{font-size:clamp(68px,22vw,112px);font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--ink);text-shadow:0 4px 12px rgba(43,45,66,.10);font-variant-numeric:tabular-nums}
  .hint{font-size:13px;line-height:1.5;max-width:250px;color:var(--ink-3);font-weight:500}
  .label{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--ink-2)}

  /* cards */
  .card{width:min(330px,86vw);background:var(--card);border:1px solid rgba(255,255,255,.85);border-radius:var(--r-card);box-shadow:var(--sh-card)}
  .diff{display:flex;flex-direction:column;gap:6px;padding:13px 16px 11px}
  .dl{display:flex;justify-content:space-between;align-items:baseline}
  .dname,#pername{font-size:17px;font-weight:800;letter-spacing:.02em}
  .dname{color:var(--sc);transition:color .25s var(--ease)}
  #pername{color:var(--ink-2)}

  /* difficulty slider: six sections; the fill and thumb ring take the section's colour */
  .drange{-webkit-appearance:none;appearance:none;width:100%;height:36px;margin:0;background:transparent;outline:none;touch-action:none;--f:.4}
  .drange::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--gaps),linear-gradient(90deg,var(--teal),var(--sc) calc(11px + (100% - 22px) * var(--f)),rgba(43,45,66,.11) 0)}
  .drange::-moz-range-track{height:8px;border-radius:99px;background:var(--gaps),linear-gradient(90deg,var(--teal),var(--sc) calc(11px + (100% - 22px) * var(--f)),rgba(43,45,66,.11) 0)}
  .drange::-moz-range-progress{background:transparent}
  .drange::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#f3f1ee);border:3px solid var(--sc);box-shadow:0 2px 6px rgba(43,45,66,.22),0 0 0 0 rgba(0,0,0,0);transition:transform .18s var(--spring),box-shadow .18s var(--ease)}
  .drange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--sc);box-shadow:0 2px 6px rgba(43,45,66,.22);transition:transform .18s var(--spring)}
  .drange.drag::-webkit-slider-thumb,.drange:active::-webkit-slider-thumb{transform:scale(1.42);box-shadow:0 4px 12px rgba(43,45,66,.22),0 0 0 6px rgba(255,255,255,.55)}
  .drange.drag::-moz-range-thumb,.drange:active::-moz-range-thumb{transform:scale(1.42)}
  .drange:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(46,196,214,.3)}
  .dticks{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink-3)}

  /* columns segmented control with a sliding pill */
  .seg{position:relative;display:flex;background:rgba(43,45,66,.06);border-radius:14px;padding:4px}
  .seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:11px;background:linear-gradient(180deg,var(--teal-hi),var(--teal));box-shadow:0 3px 10px rgba(46,196,214,.35),0 1px 0 rgba(255,255,255,.4) inset;transition:transform .32s var(--spring)}
  .seg[data-sel="3"] .pill{transform:translateX(100%)}
  .seg button{position:relative;flex:1;border:0;background:none;border-radius:11px;padding:10px 6px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink-2);transition:color .2s var(--ease),transform .15s var(--ease)}
  .seg button.on{color:#fff}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
  .seg.sm{flex:0 0 64%;padding:3px;border-radius:12px} .seg.sm .pill{top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px}
  .seg.sm button{padding:6px;font-size:13px;border-radius:9px} #mode[data-mode="infinite"] .pill{transform:translateX(100%)}
  .seg button:active{transform:scale(.97)}

  /* buttons */
  .btn{position:relative;width:min(300px,80vw);border:0;border-radius:var(--r-pill);padding:16px 20px;font-weight:900;font-size:19px;letter-spacing:.16em;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,var(--pink-hi),var(--pink) 50%,var(--pink-lo));
    box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -2px 0 rgba(0,0,0,.06) inset,0 8px 18px rgba(255,107,129,.38),0 2px 4px rgba(236,79,106,.25);
    transition:transform .22s var(--spring),box-shadow .2s var(--ease)}
  .btn:active{transform:scale(.955);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 3px 8px rgba(255,107,129,.32);transition-duration:.08s}
  .btn.alt{background:rgba(255,255,255,.6);color:var(--ink);font-size:15px;letter-spacing:.14em;padding:13px 20px;box-shadow:0 0 0 1.5px rgba(43,45,66,.14) inset,0 2px 6px rgba(43,45,66,.05)}
  .btn.alt:active{box-shadow:0 0 0 1.5px rgba(43,45,66,.2) inset}

  /* pause button */
  #pbtn{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);box-shadow:0 4px 12px rgba(43,45,66,.10);display:none;align-items:center;justify-content:center;gap:4px;cursor:pointer;z-index:5;transition:transform .2s var(--spring)}
  #pbtn i{display:block;width:4px;height:14px;border-radius:2px;background:var(--ink-2)}
  #pbtn:active{transform:scale(.9)}

  /* weather notification */
  #wxnote{position:fixed;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 106px);display:flex;align-items:center;gap:9px;padding:7px 15px 7px 8px;border-radius:var(--r-pill);white-space:nowrap;pointer-events:none;z-index:4;color:var(--ink);
    background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:0 4px 12px rgba(43,45,66,.10),0 1px 0 rgba(255,255,255,.8) inset;
    opacity:0;transform:translate(-50%,-10px) scale(.92);transition:opacity .22s var(--ease),transform .28s var(--ease)}
  #wxnote.show{opacity:1;transform:translate(-50%,0) scale(1);transition:opacity .3s var(--ease),transform .55s var(--spring)}
  #wxnote .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(43,45,66,.06);flex:none}
  #wxnote svg{width:16px;height:16px;fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #wxnote .tx{display:flex;flex-direction:column;gap:1px;line-height:1.1}
  #wxnote b{font-size:13.5px;font-weight:800;letter-spacing:-.005em}
  #wxnote small{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  #wxnote.dark{color:#f5f5f7;background:rgba(40,42,56,.5);border-color:rgba(255,255,255,.16);box-shadow:0 4px 14px rgba(0,0,0,.18),0 1px 0 rgba(255,255,255,.14) inset}
  #wxnote.dark .ic{background:rgba(255,255,255,.1)} #wxnote.dark svg{stroke:rgba(245,245,247,.82)} #wxnote.dark small{color:rgba(235,235,245,.5)}
  /* best score card */
  .best{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 18px 11px}
  .best span{font-size:11px;font-weight:900;letter-spacing:.2em;background:linear-gradient(180deg,var(--gold-hi),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .best b{font-size:28px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .best i{font-style:normal;font-size:12px;font-weight:600;color:var(--ink-3);width:100%;margin-top:-2px}
  .best.celebrate{animation:celebrate 1.6s var(--ease) both}
  @keyframes celebrate{0%{box-shadow:var(--sh-card),0 0 0 0 rgba(233,162,59,.55)}35%{box-shadow:var(--sh-card),0 0 0 10px rgba(233,162,59,0)}36%{box-shadow:var(--sh-card),0 0 0 0 rgba(233,162,59,.4)}80%,100%{box-shadow:var(--sh-card),0 0 0 12px rgba(233,162,59,0)}}
  .tag{min-height:22px;font-weight:900;letter-spacing:.2em;font-size:12px}
  .tag:not(:empty){padding:4px 12px;border-radius:99px;color:#fff;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:0 4px 12px rgba(233,162,59,.35);animation:tagpop .45s var(--spring) both}
  @keyframes tagpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  #ocombo{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--gold);min-height:18px;margin-top:-6px}

  /* home preview canvas: the real balls, idling */
  #pv{width:min(300px,80vw);height:62px;display:block}

  .swap{display:inline-block;animation:swap .24s var(--ease)}
  .best.swap{display:flex}
  @keyframes swap{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (max-height:700px){ .screen{gap:10px} #pv{height:44px} .logo{font-size:clamp(34px,10vw,48px)} .diff{padding:10px 14px 8px} .btn{padding:14px 20px} }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="screen" id="menu">
  <h1 class="logo" aria-label="Mirror Drop"><span class="p">MIRROR</span><span class="c">DROP</span></h1>
  <div class="sub">two balls. one tap.</div>
  <canvas id="pv" aria-hidden="true"></canvas>
  <div class="card diff"><div class="dl"><span class="label">DIFFICULTY</span><b class="dname">Normal</b></div><input class="drange" type="range" min="0" max="120" step="any" value="50" aria-label="Difficulty"><div class="dticks"><span>Chill</span><span>Impossible</span></div></div>
  <div class="card diff"><div class="dl"><span class="label">COLUMNS</span><b id="pername">6 columns</b></div><div class="seg" data-sel="3"><span class="pill"></span><button data-per="2">2 per side</button><button data-per="3">3 per side</button></div><div class="mrow"><span class="label">MODE</span><div class="seg sm" id="mode" data-mode="normal"><span class="pill"></span><button data-mode="normal">Normal</button><button data-mode="infinite">Infinite</button></div></div></div>
  <button class="btn" id="play">PLAY</button>
  <div class="card best" id="mbest"></div>
  <div class="hint">tap to move the balls one step.<br>at the edge they turn around.</div>
</div>

<button id="pbtn" aria-label="Pause"><i></i><i></i></button>
<div id="wxnote" role="status" aria-live="polite"></div>
<div class="screen" id="pause">
  <h1 class="logo"><span class="c">PAUSED</span></h1>
  <div class="hint" id="pfog">Careful: every pause brings in more fog.</div>
  <button class="btn" id="resume">RESUME</button>
  <button class="btn alt" id="pmenu">RETURN TO MENU</button>
</div>
<div class="screen" id="over">
  <div class="tag" id="onew"></div>
  <h1 class="logo"><span class="p">CRASH</span></h1>
  <div class="big" id="oscore">0</div>
  <div id="ocombo"></div>
  <div class="card best" id="obest"></div>
  <div class="card diff"><div class="dl"><span class="label">DIFFICULTY</span><b class="dname">Normal</b></div><input class="drange" type="range" min="0" max="120" step="any" value="50" aria-label="Difficulty"><div class="dticks"><span>Chill</span><span>Impossible</span></div></div>
  <button class="btn" id="retry">TRY AGAIN</button>
  <button class="btn alt" id="tomenu">RETURN TO MENU</button>
</div>

<script>
// Mirror Drop: two mirrored balls, one tap. Squeeze together or spread apart.
// Dodge the blocks, catch the gems. Every 10 seconds the world speeds up, by less each time.
const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
const pv = document.getElementById('pv'), pctx = pv.getContext('2d');
let ctx = mainCtx;
const $ = s => document.querySelector(s);
// section gaps for the difficulty track (shared by both browsers' track styles)
document.documentElement.style.setProperty('--gaps', [1, 2, 3, 4, 5].map(k => `linear-gradient(90deg,transparent calc(11px + (100% - 22px) * ${k}/6 - 1.5px),rgba(255,255,255,.95) 0,rgba(255,255,255,.95) calc(11px + (100% - 22px) * ${k}/6 + 1.5px),transparent 0)`).join(','));
// per = ball positions per side (2 or 3). Columns N = per * 2; the two balls always mirror each other.
let per = 3; try { per = +localStorage.mirrorPer === 2 ? 2 : 3; } catch (e) {}
let mode = 'normal'; try { mode = localStorage.mirrorMode === 'infinite' ? 'infinite' : 'normal'; } catch (e) {}
const GOAL = 1000; let won = false; // Normal mode ends the run at 1000 points
let W = 520, N = 6, LX = [];
let H = 800, BY = 640; // H grows on tall phones so the field fills the screen
function layout() { W = per === 2 ? 480 : 520; N = per * 2; LX = Array.from({ length: N }, (_, i) => (i + .5) * W / N); resize(); }
const bw = () => Math.min(70, W / N * .82);
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); H = Math.max(800, W * innerHeight / innerWidth); BY = H - 250; // keep the balls above where a thumb rests
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(cv.width / W, cv.height / H);
  offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); layout();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => Math.min(1, Math.max(0, x));

// ---------- difficulty ----------
const NAMES = ['Chill', 'Easy', 'Normal', 'Hard', 'Insane', 'Impossible'];
const SECT_COL = ['#2ec4d6', '#3fb4dc', '#6a9fdf', '#a58ad9', '#e07aa8', '#ff6b81']; // teal → pink across the sections
// The slider runs 0..120 and moves freely. It is split into six equal sections; whichever section
// the thumb sits in decides the difficulty, and each section plays at one fixed setting.
const SECT_DIFF = [0, .25, .5, .75, 1, 1.2];
let sliderV = 50, diff = .5, bests = {};
try {
  const v = parseFloat(localStorage.mirrorSlider), d = parseFloat(localStorage.mirrorDiff);
  if (v >= 0 && v <= 120) sliderV = v; else if (d >= 0 && d <= 1.2) sliderV = d > 1 ? 110 : Math.min(99, d * 100);
  bests = JSON.parse(localStorage.mirrorBests || '{}');
} catch (e) {}
const section = () => Math.min(5, Math.floor(sliderV / 20));
diff = SECT_DIFF[section()];
const bucket = section;
// Difficulty 0..1. Each 10s level adds `step` speed and tightens the row gap, down to a floor of `minTime` seconds between rows.
const params = () => ({ start: 270 + 230 * diff, step: 18 + 36 * diff, max: 600 + 380 * diff, gap: 280 - 70 * diff, shrink: 4 + 12 * diff, minTime: .46 - .20 * diff, flip: .5 + .4 * diff });
// Speed-ups shrink as you get faster: the first jumps are big, later ones smaller, approaching the top speed.
const LEVEL_TIME = 10;
const targetSpeed = n => { const p = params(), k = 1 - Math.min(.55, 2.4 * (2 + .8 * diff) * p.step / (p.max - p.start)); return p.start + (p.max - p.start) * (1 - Math.pow(k, n)); };
const rowGap = () => { const p = params(); return Math.max(p.gap - level * p.shrink, speed * p.minTime); };
const bkey = () => per + '_' + bucket() + (mode === 'infinite' ? '_inf' : ''); // infinite runs keep their own bests
const bestNow = () => bests[bkey()] || 0;
// soft slide-in whenever a label's text actually changes
function bump(el) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
function swapText(el, v) { if (el.textContent !== v) { el.textContent = v; bump(el); } }
function swapHTML(el, v) { if (el.innerHTML !== v) { el.innerHTML = v; bump(el); } }
function syncDiffUI() {
  document.documentElement.style.setProperty('--sc', SECT_COL[bucket()]);
  document.querySelectorAll('.drange').forEach(r => { if (+r.value !== sliderV) r.value = sliderV; r.style.setProperty('--f', sliderV / 120); r.setAttribute('aria-valuetext', NAMES[bucket()]); });
  document.querySelectorAll('.dname').forEach(n => swapText(n, NAMES[bucket()]));
  const bh = bestNow() ? `<span>BEST</span><b>${bestNow()}</b><i>${NAMES[bucket()]} · ${N} columns${mode === 'infinite' ? ' · infinite' : ''}</i>` : `<span>BEST</span><b>–</b><i>no ${mode === 'infinite' ? 'infinite ' : ''}score yet on ${NAMES[bucket()]} · ${N} columns</i>`;
  ['#mbest', '#obest'].forEach(id => swapHTML($(id), bh));
  document.querySelectorAll('.seg:not(#mode)').forEach(s => { s.dataset.sel = per; });
  document.querySelectorAll('.seg button[data-per]').forEach(b => b.classList.toggle('on', +b.dataset.per === per));
  $('#mode').dataset.mode = mode; document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode)); swapText($('#pername'), N + ' columns');
}
// thumb grows while a finger is on the slider
document.querySelectorAll('.drange').forEach(r => {
  r.addEventListener('pointerdown', () => r.classList.add('drag'));
  ['pointerup', 'pointercancel', 'blur'].forEach(ev => r.addEventListener(ev, () => r.classList.remove('drag')));
});
addEventListener('pointerup', () => document.querySelectorAll('.drange.drag').forEach(r => r.classList.remove('drag')));
document.querySelectorAll('.drange').forEach(r => r.addEventListener('input', () => {
  sliderV = +r.value; diff = SECT_DIFF[section()]; try { localStorage.mirrorSlider = sliderV; } catch (e) {} syncDiffUI();
}));

// ---------- audio ----------
let ac;
function beep(f, d = .1, type = 'sine', vol = .07, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), ac.currentTime + d);
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// ---------- state ----------
let state = 'menu', t = 0, shake = 0, demoT = 0;
let fog = 0, resumeT = 0, fogT = 0; const bv = [0, 0], trail = [[], []], SPRING = 36;
let pos, dirv, bx, things, parts, floaters, score, combo, speed, nextY, pulse, level, levelT, fxA, banner, newBest;
// visual-only feedback timers (they never affect the rules)
const fx = { gem: 0, combo: 0, score: 0, arrow: 0, squash: 0, near: 0, nearCool: 0, freeze: 0, dead: 0, edgePending: false, lastMove: -9, maxCombo: 1, shownScore: 0 };
const crash = { ball: [null, null], shards: [], waves: [], tmpl: null };
// weather: rare random FOG and super-rare STORM (visual events; lightning can electrify a block and slide it side to side)
// per-second chances once the cooldown has passed; warn = seconds of notice before it starts (longer for events that affect play)
const WX = {
  fog: { dur: 15, p: 1 / 40, warn: 2.2, note: ['Fog rolling in', 'Visibility will drop'] }, storm: { dur: 22, p: 1 / 380, warn: 2.2, note: ['Storm incoming', 'Lightning can charge blocks'] },
  hail: { dur: 12, p: 1 / 90, warn: 1.6, note: ['Hail incoming', 'Short and heavy'] }, wind: { dur: 4.5, p: 1 / 110, warn: 2.2, note: ['Wind gust', 'Both balls will drift'] },
  heat: { dur: 14, p: 1 / 140, warn: .8, note: ['Heat wave', 'The air will shimmer'] }, sun: { dur: 3.2, p: 1 / 200, warn: .5, note: ['Sun flash', 'Brief glare'] },

  const lp = ctx.createLinearGradient(0, 0, W / 2, 0); lp.addColorStop(0, 'rgba(255,107,129,.13)'); lp.addColorStop(1, 'rgba(255,107,129,.06)');
  ctx.fillStyle = lp; ctx.fillRect(-20, -20, W / 2 + 20, H + 40);
  const rp = ctx.createLinearGradient(W, 0, W / 2, 0); rp.addColorStop(0, 'rgba(46,196,214,.14)'); rp.addColorStop(1, 'rgba(46,196,214,.06)');
  ctx.fillStyle = rp; ctx.fillRect(W / 2, -20, W / 2 + 20, H + 40);
  const cg = ctx.createRadialGradient(W / 2, BY, 10, W / 2, BY, H * .7); cg.addColorStop(0, `rgba(255,255,255,${.35 + pulseA * .25})`); cg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = cg; ctx.fillRect(-20, -20, W + 40, H + 40);
}
function drawDivider(k) {
  const w = 9 + k * 24, g = ctx.createLinearGradient(W / 2 - w, 0, W / 2 + w, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(255,255,255,${.28 + k * .5})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(W / 2 - w, -20, w * 2, H + 40);
  ctx.fillStyle = `rgba(43,45,66,${.07 + k * .06})`; ctx.fillRect(W / 2 - 1, -20, 2, H + 40);
}

// ---------- draw: frame ----------
let shownScore = 0;
let heatC = null;
function draw() {
  ctx = mainCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#f6f1ea'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, offX + (Math.random() - .5) * shake * scale, offY + (Math.random() - .5) * shake * scale);
  ctx.save(); ctx.beginPath(); ctx.rect(-20, -20, W + 40, H + 40); ctx.clip();
  const playing = state !== 'menu';
  drawBackground(fxA * fxA);
  drawDivider(Math.max(pulse * .5, fxA, state === 'menu' ? 0 : 0));
  if (!playing) { ctx.restore(); return; } // the home screen shows only the calm backdrop; the balls live in its preview

  // column guides
  const off = (t * speed * .5) % 64;
  ctx.fillStyle = 'rgba(43,45,66,.045)';
  LX.forEach(x => { for (let y = -64 + off; y < H; y += 64) { ctx.beginPath(); ctx.roundRect(x - 1.5, y, 3, 22, 1.5); ctx.fill(); } });

  drawBackWeather();
  drawRain();
  const motion = clamp01((speed - 450) / 500);
  for (const o of things) {
    const x = bxOf(o);
    if (o.k !== 'b') { drawGem(x, o.y, o.ph); continue; }
    if (o.hitAt !== undefined && state === 'dead') { // the block takes the hit: a short jolt and squash
      const k = Math.max(0, fx.dead - o.hitAt), dmp = Math.max(0, 1 - k / .3), sq = Math.max(0, 1 - k / .18);
      ctx.save(); ctx.translate(x + Math.sin(k * 75) * 3.2 * dmp, o.y - 3 * sq); ctx.scale(1 + .07 * sq, 1 - .13 * sq);
      drawBlock(0, 0, bw(), 44, 0, o.elec); ctx.restore();
    } else drawBlock(x, o.y, bw(), 44, state === 'dead' ? 0 : motion, o.elec);
  }
  drawHaze();
  if (wx.kind === 'heat' && wx.a > .05) { // heat refraction: wobble strips of what is already drawn
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); const hgt = Math.round(16 * dpr);
    if (!heatC || heatC.width !== cv.width || heatC.height !== cv.height) { heatC = document.createElement('canvas'); heatC.width = cv.width; heatC.height = cv.height; }
    const hx = heatC.getContext('2d'); hx.clearRect(0, 0, cv.width, cv.height); hx.drawImage(cv, 0, 0);
    for (let y = Math.floor(cv.height * .35); y < cv.height; y += hgt) { const dep = clamp01((y / cv.height - .35) / .65), off = (Math.sin(y * .021 / dpr + t * 3.4) * .7 + Math.sin(y * .047 / dpr - t * 2.1) * .3) * 5 * dpr * wx.a * dep * dep; if (Math.abs(off) > .3) ctx.drawImage(heatC, 0, y, cv.width, hgt, off, y, cv.width, hgt); } // stronger near the hot ground
    ctx.restore();
  }

  // mirror link between the pair
  ctx.strokeStyle = nightK() > .3 ? `rgba(235,240,255,${.3 + pulse * .1})` : `rgba(43,45,66,${.16 + pulse * .1})`; ctx.lineWidth = 3; ctx.setLineDash([1, 9]); ctx.lineCap = 'round';
  if (state !== 'dead') { ctx.beginPath(); ctx.moveTo(bx[0], BY); ctx.lineTo(bx[1], BY); ctx.stroke(); }
  ctx.setLineDash([]);
  if (state === 'dead') { const tw = crash.ball[1 - (crash.first || 0)];
    if (tw && tw.chain && !tw.burst) { // a bright pulse races along the link to the twin
      const a0 = bx[crash.first || 0], a1 = bx[1 - (crash.first || 0)], p = clamp01(fx.dead / Math.max(.01, tw.at)), xp = a0 + (a1 - a0) * p;
      const lg = ctx.createLinearGradient(a0, 0, xp, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(1, tw.elec ? 'rgba(190,225,255,.95)' : 'rgba(255,255,255,.95)');
      ctx.strokeStyle = lg; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(a0, BY); ctx.lineTo(xp, BY); ctx.stroke();
    } }

  // the balls: identical size, timing, glow and squash; highlight mirrored
  const glow = Math.min(1, .15 + Math.min(.35, Math.abs(bv[0]) / 3000) + fx.gem * .5 + fx.near * .45 + fx.squash * .35 + fxA * .3);
  const st = Math.min(.16, Math.abs(bv[0]) / 4500);
  const sx = (1 + st) * (1 - .12 * fx.squash), sy = (1 - st * .7) * (1 + .09 * fx.squash);
  const r = 20 * (1 + pulse * .04 + fx.gem * .08);
  for (let i = 0; i < 2; i++) {
    const x = bx[i], P = PAL[i];
    if (trail[i].length && state !== 'dead') { // short motion trail
      ctx.strokeStyle = P.base; ctx.lineCap = 'round';
      ctx.globalAlpha = .12; ctx.lineWidth = 28; ctx.beginPath(); ctx.moveTo(trail[i][0], BY); ctx.lineTo(x, BY); ctx.stroke();
      ctx.globalAlpha = .2; ctx.lineWidth = 36; ctx.beginPath(); ctx.moveTo(trail[i][trail[i].length >> 1], BY); ctx.lineTo(x, BY); ctx.stroke(); ctx.globalAlpha = 1;
    }
    const c = state === 'dead' ? crash.ball[i] : null;
    if (!c) drawBall(x, BY, r, P, i ? 1 : -1, sx, sy, state === 'dead' ? .25 : glow, fx.gem * .8);
    else if (c.chain && !c.burst && !c.elec) { const q = clamp01(fx.dead / c.at); drawBall(x, BY, r * (1 + .12 * q), P, i ? 1 : -1, 1 + .06 * q, 1 - .05 * q, .6 + q * .4, q * .9); } // charging as the pulse arrives
    else if (c.elec && !c.burst) { // electrocution: blue-white flash wrapped in small arcs, then it bursts
      drawBall(x, BY, r * (1 + .06 * Math.random()), ELEC, i ? 1 : -1, 1, 1, 1, .85);
      const eg = ctx.createRadialGradient(x, BY, 10, x, BY, 54); eg.addColorStop(0, 'rgba(190,225,255,.55)'); eg.addColorStop(1, 'rgba(190,225,255,0)');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(x, BY, 54, 0, 7); ctx.fill(); drawArcs(x, BY, 24, 24, 6, .95);
    }
    else { // impact frame: the ball squashes flat and flares white as it bursts, gone within ~60ms
      const k = clamp01((fx.dead - (c.bt || 0)) / .06);
      if (k < 1) drawBall(x, BY + 3, r, c.elec ? ELEC : P, i ? 1 : -1, 1.32 + .25 * k, .7 - .3 * k, 1, 1, 1 - k);
    }
    if (state === 'play') { const nd = (pos + dirv > per - 1 || pos + dirv < 0) ? -dirv : dirv; drawArrow(x, BY, (x < W / 2 ? 1 : -1) * nd, .32 + fx.arrow * .4, ease(fx.arrow)); }
  }
  parts.forEach(q => { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  drawStorm();
  drawFrontWeather();

  // speed-up: soft streaks, background pulse handled above, banner slides in and out quickly
  if (fxA > 0 && state === 'play') {
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = 0; i < 10; i++) {
      const x = (i * 53 + 17) % W, y = ((t * 1400 + i * 137) % (H + 240)) - 120;
      ctx.strokeStyle = i % 2 ? `rgba(46,196,214,${fxA * .28})` : `rgba(255,107,129,${fxA * .28})`;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 80 + (i % 3) * 30); ctx.stroke();
    }
    const age = 1 - fxA, inK = ease(age / .18), outK = clamp01((age - .75) / .25);
    ctx.save(); ctx.globalAlpha = inK * (1 - outK); ctx.translate(W / 2, 240 + (1 - inK) * -18 + outK * -10);
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.roundRect(-150, -48, 300, 92, 24); ctx.fill();
    txt(banner, 0, 0, 46, '#e9a23b', 'center', 900); txt(`LEVEL ${level + 1}`, 0, 30, 16, 'rgba(43,45,66,.55)', 'center', 800);
    ctx.restore();
  }

  // pause fog: a frosted liquid-glass sheet with a glossy lip; pink and cyan tints mirror each other
  const fogVis = resumeT > 0 || state === 'paused' ? 1 : clamp01(fogT / .8);
  if (fog > 0 && fogVis > 0) {
    ctx.save(); ctx.globalAlpha = fogVis;
    const fy = Math.min(BY - 110, (BY - 60) * Math.min(.88, .3 * fog + .15)), fade = 120;
    // the wavy lower edge, symmetric about the centre line
    const edge = x => fy + Math.sin((Math.abs(x - W / 2) / W) * 9 - t * 1.1) * 7 + Math.sin(t * .7) * 3;
    const sheet = () => { ctx.beginPath(); ctx.moveTo(-20, -20); ctx.lineTo(W + 20, -20); for (let x = W + 20; x >= -20; x -= 10) ctx.lineTo(x, edge(x)); ctx.closePath(); };
    // soft falloff below the lip so blocks emerge gradually
    const fg = ctx.createLinearGradient(0, fy - 10, 0, fy + fade); fg.addColorStop(0, 'rgba(248,245,241,.92)'); fg.addColorStop(1, 'rgba(248,245,241,0)');
    ctx.fillStyle = fg; ctx.fillRect(-20, fy - 10, W + 40, fade + 10);
    // frosted body: fully opaque so nothing behind it can be read
    const body = ctx.createLinearGradient(0, 0, 0, fy); body.addColorStop(0, '#fbf9f6'); body.addColorStop(1, '#f3efea');
    ctx.fillStyle = body; sheet(); ctx.fill();
    ctx.save(); sheet(); ctx.clip();
    [[0, '255,107,129'], [1, '46,196,214']].forEach(([sd, c]) => { // mirrored tint pools
      const x = sd ? W * .82 : W * .18, y = fy * .55, rg = ctx.createRadialGradient(x, y, 0, x, y, W * .55);
      rg.addColorStop(0, `rgba(${c},.13)`); rg.addColorStop(1, `rgba(${c},0)`); ctx.fillStyle = rg; ctx.fillRect(-20, -20, W + 40, fy + 40);
    });
    for (let i = 0; i < 3; i++) for (let sd = 0; sd < 2; sd++) { // slow soft billows drifting toward the centre
      const d = ((i * 83 + t * 12) % (W / 2 + 60)) - 30, x = sd ? W - d : d, y = fy - 26 + Math.sin(t * .8 + i * 2) * 8, R = 54 + (i % 2) * 18;
      const pg = ctx.createRadialGradient(x, y, 0, x, y, R); pg.addColorStop(0, 'rgba(255,255,255,.5)'); pg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
    }
    const sx = ((t * 60) % (W + 400)) - 200, sh = ctx.createLinearGradient(sx - 90, 0, sx + 90, fy); // slow glass sheen
    sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(.5, 'rgba(255,255,255,.35)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh; ctx.fillRect(-20, -20, W + 40, fy + 40);
    ctx.restore();
    // glossy lip: soft shadow under a bright highlight line
    const lip = () => { ctx.beginPath(); for (let x = -20; x <= W + 20; x += 10) x === -20 ? ctx.moveTo(x, edge(x)) : ctx.lineTo(x, edge(x)); };
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.save(); ctx.translate(0, 4); ctx.strokeStyle = 'rgba(43,45,66,.06)'; ctx.lineWidth = 8; lip(); ctx.stroke(); ctx.restore();
    const lg = ctx.createLinearGradient(0, 0, W, 0); lg.addColorStop(0, 'rgba(255,107,129,.55)'); lg.addColorStop(.5, 'rgba(255,255,255,.95)'); lg.addColorStop(1, 'rgba(46,196,214,.55)');
    ctx.strokeStyle = lg; ctx.lineWidth = 2; lip(); ctx.stroke();
    ctx.restore();
  }
  if (state === 'play' && resumeT > 0) { // clean ring countdown
    const cy = H * .42, frac = resumeT - Math.floor(resumeT), pop = 1 + .22 * Math.max(0, frac - .7) / .3;
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(W / 2, cy, 62, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(43,45,66,.08)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(W / 2, cy, 56, 0, 7); ctx.stroke();
    const rg = ctx.createLinearGradient(W / 2 - 56, 0, W / 2 + 56, 0); rg.addColorStop(0, '#ff6b81'); rg.addColorStop(1, '#2ec4d6');
    ctx.strokeStyle = rg; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(W / 2, cy, 56, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (resumeT / 3)); ctx.stroke();
    ctx.save(); ctx.translate(W / 2, cy + 22); ctx.scale(pop, pop); txt(Math.ceil(resumeT) + '', 0, 0, 64, '#2b2d42', 'center', 900); ctx.restore();
    txt('get ready', W / 2, cy + 96, 18, 'rgba(43,45,66,.5)', 'center', 700);
  }
  floaters.forEach(f => { ctx.globalAlpha = f.life; txt(f.txt, f.x, f.y, 22, f.col, 'center', 900); }); ctx.globalAlpha = 1;

  // crash: darken + desaturate the frozen scene
  if (state === 'dead' && !won) {
    const k = clamp01(fx.dead / .4);
    ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = `rgba(128,128,128,${k * .55})`; ctx.fillRect(-20, -20, W + 40, H + 40); ctx.restore();
    ctx.fillStyle = `rgba(43,45,66,${k * .1})`; ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  if (crash.shards.length || crash.waves.length) drawCrash();

  if (state === 'play' || state === 'paused') {
    if (score !== shownScore) { if (score > shownScore) fx.score = 1; shownScore = score; }
    const k = 1 + .14 * ease(fx.score);
    ctx.save(); ctx.translate(W / 2, 94); ctx.scale(k, k);
    txt(score + '', 0, 3, 70, 'rgba(43,45,66,.08)', 'center', 900); txt(score + '', 0, 0, 70, hudInk(1), 'center', 900); ctx.restore();
    txt('LEVEL ' + (level + 1) + '  ·  ' + NAMES[bucket()].toUpperCase(), W / 2, 124, 14, hudInk(.45), 'center', 800);
    const nb = score > bestNow() && bestNow() > 0; // live high score in the top-right corner
    txt(nb ? 'NEW BEST' : 'BEST', W - 18, 32, 11, nb ? '#ff6b81' : '#e9a23b', 'right', 900); txt(Math.max(score, bestNow()) + '', W - 18, 56, 22, hudInk(.7), 'right', 900);
    if (combo > 1) { // combo pill grows a little warmer as it climbs
      const ck = 1 + .25 * ease(fx.combo), heat = clamp01((combo - 2) / 6);
      ctx.save(); ctx.translate(W / 2, 156); ctx.scale(ck, ck);
      if (heat > 0) { const cg = ctx.createRadialGradient(0, 0, 4, 0, 0, 46); cg.addColorStop(0, `rgba(255,200,103,${.25 * heat})`); cg.addColorStop(1, 'rgba(255,200,103,0)'); ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.roundRect(-34, -16, 68, 30, 15); ctx.fill();
      txt('x' + combo, 0, 7, 20, combo >= 5 ? '#f08f1c' : '#e9a23b', 'center', 900); ctx.restore();
    }
    // countdown to the next speed-up
    ctx.fillStyle = 'rgba(43,45,66,.08)'; ctx.beginPath(); ctx.roundRect(W / 2 - 80, 22, 160, 6, 3); ctx.fill();
    const bg = ctx.createLinearGradient(W / 2 - 80, 0, W / 2 + 80, 0); bg.addColorStop(0, '#ff6b81'); bg.addColorStop(1, '#2ec4d6');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(W / 2 - 80, 22, Math.max(6, 160 * clamp01(levelT / LEVEL_TIME)), 6, 3); ctx.fill();
  }
  ctx.restore();
}

// home screen preview: the same balls on a miniature track, gently idling in sync
function drawPreview() {
  const w = pv.clientWidth, h = pv.clientHeight; if (!w || !h) return;
  if (pv.width !== Math.round(w * dpr) || pv.height !== Math.round(h * dpr)) { pv.width = Math.round(w * dpr); pv.height = Math.round(h * dpr); }
  ctx = pctx; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const s = w / W, cy = h / 2, r = Math.min(15, h * .26), breathe = .2 + .12 * (Math.sin(t * 1.8) * .5 + .5);
  ctx.fillStyle = 'rgba(43,45,66,.06)'; LX.forEach(x => { ctx.beginPath(); ctx.roundRect(x * s - 1, 6, 2, h - 12, 1); ctx.fill(); });
  const dg = ctx.createLinearGradient(0, 0, 0, h); dg.addColorStop(0, 'rgba(43,45,66,0)'); dg.addColorStop(.5, 'rgba(43,45,66,.14)'); dg.addColorStop(1, 'rgba(43,45,66,0)');
  ctx.fillStyle = dg; ctx.fillRect(w / 2 - 1, 0, 2, h);
  ctx.strokeStyle = 'rgba(43,45,66,.16)'; ctx.lineWidth = 2.4; ctx.setLineDash([1, 7]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx[0] * s, cy); ctx.lineTo(bx[1] * s, cy); ctx.stroke(); ctx.setLineDash([]);
  const st = Math.min(.14, Math.abs(bv[0]) / 4500);
  for (let i = 0; i < 2; i++) drawBall(bx[i] * s, cy, r, PAL[i], i ? 1 : -1, 1 + st, 1 - st * .7, breathe + Math.min(.3, Math.abs(bv[0]) / 3000));
  ctx = mainCtx;
}

let last = performance.now();
(function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); if (state === 'menu') drawPreview(); requestAnimationFrame(loop); })(last);
syncDiffUI(); show('#menu', true);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && resumeT <= 0) { pauseGame(true); } }); // leaving the app pauses without the fog penalty
</script>
