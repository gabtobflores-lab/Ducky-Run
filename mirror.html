<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mirror Drop</title>
<style>
  :root{--ink:#2b2d42;--pink:#ff6b81;--teal:#2ec4d6;--amber:#ff9f1c;--paper:#f4efe6}
  html,body{margin:0;height:100%;height:100dvh;background:var(--paper);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  canvas{display:block;width:100%;height:100%}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));text-align:center;background:rgba(244,239,230,.84);backdrop-filter:blur(3px)}
  .screen.on{display:flex;animation:in .35s}
  @keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  h1{margin:0;font-size:clamp(38px,11vw,60px);letter-spacing:.04em;line-height:1}
  h1 i{font-style:normal;color:var(--pink)} h1 u{text-decoration:none;color:var(--teal)}
  .sub{font-size:16px;opacity:.7;margin-top:-6px}
  .big{font-size:clamp(64px,22vw,110px);font-weight:900;line-height:1}
  .tag{font-weight:800;letter-spacing:.14em;font-size:14px;color:var(--amber)}
  .btn{width:min(300px,80vw);border:0;border-radius:99px;padding:15px 20px;font:inherit;font-weight:900;font-size:20px;letter-spacing:.14em;cursor:pointer;color:#fff;background:var(--pink);box-shadow:0 6px 0 #d94d64;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d94d64}
  .btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px rgba(43,45,66,.25);font-size:16px;padding:12px 20px}
  .btn.alt:active{box-shadow:inset 0 0 0 3px rgba(43,45,66,.25);transform:scale(.97)}
  .diff{width:min(320px,82vw);display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.55);border-radius:18px;padding:12px 16px}
  .dl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.14em;font-weight:800}
  .dname{font-size:18px;letter-spacing:.04em;color:var(--teal)}
  .drange{width:100%;accent-color:var(--teal);height:28px;margin:0}
  .dticks{display:flex;justify-content:space-between;font-size:11px;opacity:.55;font-weight:700}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;border:0;border-radius:12px;padding:10px 6px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:rgba(43,45,66,.08);color:var(--ink)}
  .seg button.on{background:var(--teal);color:#fff}
  #pbtn{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(43,45,66,.12);color:var(--ink);font-size:16px;font-weight:900;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:5}
  .small{font-size:13px;opacity:.65}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="screen" id="menu">
  <h1><i>MIRROR</i> <u>DROP</u></h1>
  <div class="sub">two balls. one tap.</div>
  <div class="diff"><div class="dl"><span>DIFFICULTY</span><b class="dname">Normal</b></div><input class="drange" type="range" min="0" max="120" value="50" aria-label="Difficulty"><div class="dticks"><span>Chill</span><span>Impossible</span></div></div>
  <div class="diff"><div class="dl"><span>COLUMNS</span><b id="pername">6 columns</b></div><div class="seg"><button data-per="2">2 per side</button><button data-per="3">3 per side</button></div></div>
  <button class="btn" id="play">PLAY</button>
  <div class="small" id="mbest"></div>
  <div class="small">tap to move the balls one step. at the edge they turn around</div>
</div>

<button id="pbtn" aria-label="Pause">❚❚</button>
<div class="screen" id="pause">
  <h1><u>PAUSED</u></h1>
  <div class="small" id="pfog">Careful: every pause brings in more fog.</div>
  <button class="btn" id="resume">RESUME</button>
  <button class="btn alt" id="pmenu">RETURN TO MENU</button>
</div>
<div class="screen" id="over">
  <div class="tag" id="onew"></div>
  <h1><i>CRASH</i></h1>
  <div class="big" id="oscore">0</div>
  <div class="small" id="obest"></div>
  <div class="diff"><div class="dl"><span>DIFFICULTY</span><b class="dname">Normal</b></div><input class="drange" type="range" min="0" max="120" value="50" aria-label="Difficulty"><div class="dticks"><span>Chill</span><span>Impossible</span></div></div>
  <button class="btn" id="retry">TRY AGAIN</button>
  <button class="btn alt" id="tomenu">RETURN TO MENU</button>
</div>

<script>
// Mirror Drop: two mirrored balls, one tap. Squeeze together or spread apart.
// Dodge the blocks, catch the gems. Every 10 seconds the world speeds up, by less each time.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = s => document.querySelector(s);
// per = ball positions per side (2 or 3). Columns N = per * 2; the two balls always mirror each other.
let per = 3; try { per = +localStorage.mirrorPer === 2 ? 2 : 3; } catch (e) {}
let W = 520, N = 6, LX = [];
let H = 800, BY = 640; // H grows on tall phones so the field fills the screen
function layout() { W = per === 2 ? 480 : 520; N = per * 2; LX = Array.from({ length: N }, (_, i) => (i + .5) * W / N); resize(); }
const bw = () => Math.min(70, W / N * .82);
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); H = Math.max(800, W * innerHeight / innerWidth); BY = H - 250; // keep the balls above where a thumb rests
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(cv.width / W, cv.height / H);
  offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); layout();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = x => Math.min(1, Math.max(0, x));

// ---------- difficulty ----------
const NAMES = ['Chill', 'Easy', 'Normal', 'Hard', 'Insane', 'Impossible'];
let diff = .5, bests = {};
try { const d = parseFloat(localStorage.mirrorDiff); if (d >= 0 && d <= 1.2) diff = d; bests = JSON.parse(localStorage.mirrorBests || '{}'); } catch (e) {}
const bucket = () => diff > 1 ? 5 : Math.min(4, Math.floor(diff * 5)); // Impossible sits past the end of the scale (diff 1.2)
// Difficulty 0..1. Each 10s level adds `step` speed and tightens the row gap, down to a floor of `minTime` seconds between rows.
const params = () => ({ start: 270 + 230 * diff, step: 18 + 36 * diff, max: 600 + 380 * diff, gap: 280 - 70 * diff, shrink: 4 + 12 * diff, minTime: .46 - .20 * diff, flip: .5 + .4 * diff });
// Speed-ups shrink as you get faster: the first jumps are big, later ones smaller, approaching the top speed.
const LEVEL_TIME = 10;
const targetSpeed = n => { const p = params(), k = 1 - Math.min(.55, 2.4 * (2 + .8 * diff) * p.step / (p.max - p.start)); return p.start + (p.max - p.start) * (1 - Math.pow(k, n)); };
const rowGap = () => { const p = params(); return Math.max(p.gap - level * p.shrink, speed * p.minTime); };
const bkey = () => per + '_' + bucket();
const bestNow = () => bests[bkey()] || 0;
function syncDiffUI() {
  document.querySelectorAll('.drange').forEach(r => { r.value = diff > 1 ? 120 : Math.round(diff * 100); });
  document.querySelectorAll('.dname').forEach(n => { n.textContent = NAMES[bucket()]; });
  $('#mbest').textContent = bestNow() ? `best on ${NAMES[bucket()]}, ${N} columns: ${bestNow()}` : 'no score yet on this setup';
  $('#obest').textContent = `best on ${NAMES[bucket()]}, ${N} columns: ${bestNow()}`;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', +b.dataset.per === per)); $('#pername').textContent = N + ' columns';
}
document.querySelectorAll('.drange').forEach(r => r.addEventListener('input', () => {
  diff = r.value > 100 ? 1.2 : r.value / 100; try { localStorage.mirrorDiff = diff; } catch (e) {} syncDiffUI(); if (state === 'menu') reset();
}));

// ---------- audio ----------
let ac;
function beep(f, d = .1, type = 'sine', vol = .07, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), ac.currentTime + d);
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// ---------- state ----------
let state = 'menu', t = 0, shake = 0, demoT = 0;
let fog = 0, resumeT = 0; const bv = [0, 0], trail = [[], []], MOVE = .12; let mv = [{ a: 0, b: 0, t0: 0 }, { a: 0, b: 0, t0: 0 }];
let pos, dirv, bx, things, parts, floaters, score, combo, speed, nextY, pulse, level, levelT, fxA, banner, newBest;
function reset() {
  const p = params();
  pos = per - 1; dirv = -1; bx = [LX[pos], LX[N - 1 - pos]]; mv = bx.map(x => ({ a: x, b: x, t0: 0 })); trail[0] = []; trail[1] = []; scored = new Set(); things = []; parts = []; floaters = [];
  fog = 0; resumeT = 0;
  score = 0; combo = 1; speed = state === 'menu' ? 230 : p.start; nextY = -160; pulse = 0; lastSafe = per - 1; genDir = -1; level = 0; levelT = 0; fxA = 0; banner = ''; newBest = false;
  while (nextY > -1000) addRow();
}
// Three ball positions: outer (columns 0+5), middle (1+4), inner (2+3). Each row is safe for exactly one position.
let lastSafe = 0, rowId = 0, scored = new Set();
// Taps needed to reach `target` from position p heading in direction d (balls bounce at the edges).
function tapsTo(p, d, target) {
  let n = 0; while (p !== target && n < 6) { if (p + d > per - 1 || p + d < 0) d = -d; p += d; n++; }
  return [n, p, d];
}
let genDir = -1;
function addRow() {
  // The generator follows the tap path a player would take, prefers rows that need one tap,
  // and gives extra room when a row needs two or three taps.
  let sp = lastSafe, cost = 0;
  if (Math.random() < params().flip) {
    const opts = Array.from({ length: per }, (_, i) => i).filter(v => v !== lastSafe).map(v => [v, tapsTo(lastSafe, genDir, v)[0]]);
    const w = opts.map(([, c]) => c === 1 ? 1 : c === 2 ? .15 + .25 * diff : .05 + .1 * diff), tot = w.reduce((a, b) => a + b, 0);
    let r = Math.random() * tot, i = 0; while (r > w[i]) { r -= w[i]; i++; }
    sp = opts[i][0];
  }
  const [taps, , nd] = tapsTo(lastSafe, genDir, sp); cost = taps; genDir = nd; lastSafe = sp; const row = rowId++;
  Array.from({ length: per }, (_, i) => i).filter(q => q !== sp).forEach(q => {
    (Math.random() < .3 ? [q, N - 1 - q] : [Math.random() < .5 ? q : N - 1 - q]).forEach(l => things.push({ k: 'b', l, y: nextY, row }));
  });
  if (Math.random() < .55) things.push({ k: 'g', l: Math.random() < .5 ? sp : N - 1 - sp, y: nextY - rand(0, 40), ph: rand(0, 6), row });
  nextY -= rowGap() * (per === 3 ? 1.12 : 1) * (1 + .6 * Math.max(0, cost - 1));
}
reset();

function burst(x, y, n, col, sp = 220, life = .6) {
  for (let i = 0; i < n; i++) { const a = rand(0, 6.283), v = rand(sp * .2, sp); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(life * .5, life), max: life, col, r: rand(2, 5) }); }
}
function float(x, y, txt, col) { floaters.push({ x, y, txt, col, life: 1 }); }

// ---------- screens ----------
const show = (id, on) => $(id).classList.toggle('on', on);
function startGame() { show('#menu', false); show('#over', false); state = 'play'; reset(); beep(520, .15, 'triangle', .06, 300); }
function pauseGame() {
  if (state !== 'play' || resumeT > 0) return;
  state = 'paused'; $('#pfog').textContent = fog ? `Fog level ${fog}. Resuming makes it thicker.` : 'Careful: resuming brings in fog.'; show('#pause', true);
}
function resumeGame() {
  if (state !== 'paused') return;
  show('#pause', false); fog++; resumeT = 3; state = 'play'; beep(300, .3, 'sine', .06, -100);
}
$('#pbtn').onclick = pauseGame; $('#resume').onclick = resumeGame;
$('#pmenu').onclick = () => { show('#pause', false); goMenu(); };
function goMenu() { show('#over', false); state = 'menu'; reset(); syncDiffUI(); show('#menu', true); }
function showOver() {
  if (state !== 'dead') return;
  $('#oscore').textContent = score; $('#onew').textContent = newBest ? '★ NEW BEST ★' : ''; syncDiffUI(); show('#over', true);
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { per = +b.dataset.per; try { localStorage.mirrorPer = per; } catch (e) {} layout(); reset(); syncDiffUI(); });
$('#play').onclick = startGame; $('#retry').onclick = startGame; $('#tomenu').onclick = goMenu;

let flashA = 0, flashLane = 0;
function setPos(np, lane) {
  if (state !== 'play') return;
  np = Math.max(0, Math.min(per - 1, np)); flashA = 1; flashLane = lane === undefined ? np : lane;
  if (np === pos) beep(300, .04, 'triangle', .03);
  else { const d = np - pos; pos = np; pulse = 1; beep(380 + pos * 90, .08, 'triangle', .05, d * 80); }
}
const move = d => setPos(pos + d);
function cycle() { if (pos + dirv > per - 1 || pos + dirv < 0) dirv = -dirv; move(dirv); }
// tap a column and the balls go there (the other ball mirrors it on the opposite side)
// tap anywhere: the balls step one column; at the edge they turn around
cv.addEventListener('pointerdown', e => { e.preventDefault(); cycle(); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const act = ['Space', 'Enter'].includes(e.code);
  if (state === 'menu' && act) { e.preventDefault(); startGame(); }
  else if (state === 'play' && ['KeyP', 'Escape'].includes(e.code)) { e.preventDefault(); pauseGame(); }
  else if (state === 'paused' && (act || ['KeyP', 'Escape'].includes(e.code))) { e.preventDefault(); resumeGame(); }
  else if (state === 'dead' && act && $('#over').classList.contains('on')) { e.preventDefault(); startGame(); }
  else if (state === 'play' && !e.repeat) {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) { e.preventDefault(); cycle(); }
  }
});

function die(x, y) {
  state = 'dead'; shake = 14;
  burst(bx[0], BY, 24, '#ff6b81', 380, .9); burst(bx[1], BY, 24, '#2ec4d6', 380, .9); burst(x, y, 14, '#2b2d42', 300, .8);
  beep(190, .45, 'sawtooth', .1, -140);
  if (score > bestNow()) { bests[bkey()] = score; newBest = true; try { localStorage.mirrorBests = JSON.stringify(bests); } catch (e) {} }
  setTimeout(showOver, 750);
}

// ---------- update ----------
function update(dt) {
  $('#pbtn').style.display = state === 'play' ? 'flex' : 'none';
  if (state === 'paused') return;
  if (state === 'play' && resumeT > 0) { const before = Math.ceil(resumeT); resumeT -= dt; if (Math.ceil(resumeT) !== before && resumeT > 0) beep(440, .1, 'triangle', .05); return; }
  t += dt; flashA = Math.max(0, flashA - dt * 3.5); shake = Math.max(0, shake - dt * 40); pulse = Math.max(0, pulse - dt * 4); fxA = Math.max(0, fxA - dt / 1.2);
  parts.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; q.life -= dt; });
  parts = parts.filter(q => q.life > 0);
  floaters.forEach(f => { f.y -= 50 * dt; f.life -= dt * 1.1; }); floaters = floaters.filter(f => f.life > 0);
  if (state === 'dead') return;
  const tx = [LX[pos], LX[N - 1 - pos]];
  for (let i = 0; i < 2; i++) {
    // smooth eased slide over a fixed short time instead of an instant jump
    if (tx[i] !== mv[i].b) mv[i] = { a: bx[i], b: tx[i], t0: t };
    const m = mv[i], p = clamp01((t - m.t0) / MOVE), e = p * p * (3 - 2 * p);
    const ox = bx[i]; bx[i] = m.a + (m.b - m.a) * e; bv[i] = (bx[i] - ox) / Math.max(dt, .001);
    // faint trail while sliding between columns
    if (Math.abs(bv[i]) > 60) trail[i].push(ox); else if (trail[i].length) trail[i].shift();
    if (trail[i].length > 5) trail[i].shift();
  }

  if (state === 'menu') { // decorative demo behind the menu: no collisions
    demoT += dt; if (demoT > 1.2) { demoT = 0; if (pos + dirv > per - 1 || pos + dirv < 0) dirv = -dirv; pos += dirv; }
    things.forEach(o => { o.y += speed * dt; }); nextY += speed * dt; things = things.filter(o => o.y < H + 80);
    while (nextY > -300) addRow();
    return;
  }

  // predictable speed-ups every 10 seconds, eased in over ~1s, tapering toward the difficulty's top speed
  const p = params();
  levelT += dt;
  if (levelT >= LEVEL_TIME) {
    levelT -= LEVEL_TIME; level++; fxA = 1; const capped = p.max - targetSpeed(level) < 8;
    banner = capped ? 'MAX SPEED' : 'SPEED UP!'; beep(380 + Math.min(level, 12) * 35, .4, 'triangle', .08, 280);
  }
  speed += (targetSpeed(level) - speed) * Math.min(1, dt * 2.5);

  for (const o of things) {
    o.y += speed * dt;
    if (o.k === 'b' && o.y > BY + 40 && !scored.has(o.row)) { scored.add(o.row); score++; if (score % 10 === 0) { float(W / 2, 300, score + '!', '#ff9f1c'); beep(760, .2, 'triangle', .07, 300); } }
    const x = LX[o.l];
    if (Math.abs(o.y - BY) < 44) for (const b of bx) {
      if (Math.abs(b - x) < (o.k === 'b' ? 38 : 34)) {
        if (o.k === 'b') return die(x, o.y);
        if (!o.got) { o.got = true; score += combo; combo = Math.min(8, combo + 1); beep(700 + combo * 70, .12, 'triangle', .07, 400); burst(x, o.y, 12, '#ff9f1c', 220, .5); float(x, o.y - 20, '+' + (combo - 1 || 1), '#ff9f1c'); }
      }
    }
    if (o.k === 'g' && !o.got && o.y > BY + 70) { o.got = true; combo = 1; }
  }
  things = things.filter(o => o.y < H + 80 && !(o.got && o.k === 'g'));
  nextY += speed * dt;
  while (nextY > -300) addRow();
}

// ---------- draw ----------
function txt(s, x, y, size, col = '#2b2d42', al = 'center') {
  ctx.font = `800 ${size}px system-ui,sans-serif`; ctx.textAlign = al; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#f4efe6'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, offX + (Math.random() - .5) * shake * scale, offY + (Math.random() - .5) * shake * scale);
  ctx.save(); ctx.beginPath(); ctx.rect(-20, -20, W + 40, H + 40); ctx.clip();
  ctx.fillStyle = '#f4efe6'; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = 'rgba(255,107,129,.10)'; ctx.fillRect(0, 0, W / 2, H);
  ctx.fillStyle = 'rgba(46,196,214,.12)'; ctx.fillRect(W / 2, 0, W / 2, H);
  ctx.fillStyle = 'rgba(43,45,66,.12)'; ctx.fillRect(W / 2 - 2, 0, 4, H);
  const off = (t * speed * .5) % 60;
  ctx.fillStyle = 'rgba(43,45,66,.07)';
  LX.forEach(x => { for (let y = -60 + off; y < H; y += 60) ctx.fillRect(x - 2, y, 4, 24); });

  for (const o of things) {
    const x = LX[o.l];
    if (o.k === 'b') {
      ctx.fillStyle = '#2b2d42'; ctx.beginPath(); ctx.roundRect(x - bw() / 2, o.y - 22, bw(), 44, 12); ctx.fill();
      ctx.fillStyle = '#ff9f1c'; ctx.fillRect(x - bw() * .29, o.y - 4, bw() * .58, 8);
    } else {
      const s = 1 + Math.sin(t * 6 + o.ph) * .1;
      ctx.save(); ctx.translate(x, o.y); ctx.rotate(Math.PI / 4 + Math.sin(t * 3 + o.ph) * .2); ctx.scale(s, s);
      ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.roundRect(-14, -14, 28, 28, 6); ctx.fill();
      ctx.fillStyle = '#ffd37a'; ctx.fillRect(-9, -9, 10, 10); ctx.restore();
    }
  }
  ctx.strokeStyle = 'rgba(43,45,66,.25)'; ctx.lineWidth = 4; ctx.setLineDash([2, 10]); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx[0], BY); ctx.lineTo(bx[1], BY); ctx.stroke(); ctx.setLineDash([]);
  if (state !== 'dead') [['#ff6b81', bx[0]], ['#2ec4d6', bx[1]]].forEach(([c, x], i) => {
    if (trail[i].length) { // soft motion smear from where the ball just was
      ctx.strokeStyle = c; ctx.lineCap = 'round';
      ctx.globalAlpha = .16; ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(trail[i][0], BY); ctx.lineTo(x, BY); ctx.stroke();
      ctx.globalAlpha = .28; ctx.lineWidth = 38; ctx.beginPath(); ctx.moveTo(trail[i][trail[i].length >> 1], BY); ctx.lineTo(x, BY); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const st = Math.min(.18, Math.abs(bv[i]) / 4000); // gentle stretch along the move
    ctx.save(); ctx.translate(x, BY); ctx.scale(1 + st, 1 - st * .7);
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, 20 + pulse * 2, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(-6, -7, 6, 0, 7); ctx.fill(); ctx.restore();
    if (state === 'play') { const nd = (pos + dirv > per - 1 || pos + dirv < 0) ? -dirv : dirv, sx = (x < W / 2 ? 1 : -1) * nd; ctx.fillStyle = 'rgba(43,45,66,.35)'; ctx.beginPath(); ctx.moveTo(x + sx * 40, BY); ctx.lineTo(x + sx * 30, BY - 7); ctx.lineTo(x + sx * 30, BY + 7); ctx.fill(); }
    if (fxA > 0) { ctx.strokeStyle = `rgba(255,159,28,${fxA})`; ctx.lineWidth = 5 * fxA; ctx.beginPath(); ctx.arc(x, BY, 20 + (1 - fxA) * 90, 0, 7); ctx.stroke(); }
  });
  parts.forEach(q => { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;

  // speed-up animation: streaks, edge glow, ring and banner
  if (fxA > 0 && state === 'play') {
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 18; i++) {
      const x = (i * 53 + 17) % W, y = ((t * 1400 + i * 137) % (H + 240)) - 120;
      ctx.strokeStyle = i % 2 ? `rgba(46,196,214,${fxA * .4})` : `rgba(255,107,129,${fxA * .4})`;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 90 + (i % 3) * 30); ctx.stroke();
    }
    const eg = ctx.createLinearGradient(0, 0, 0, H); eg.addColorStop(0, `rgba(255,159,28,${fxA * .35})`); eg.addColorStop(.18, 'rgba(255,159,28,0)'); eg.addColorStop(.82, 'rgba(255,159,28,0)'); eg.addColorStop(1, `rgba(255,159,28,${fxA * .35})`);
    ctx.fillStyle = eg; ctx.fillRect(0, 0, W, H);
    const k = 1 + (1 - clamp01(fxA * 1.6)) * .0 + Math.max(0, fxA - .7) * 1.2;
    ctx.save(); ctx.translate(W / 2, 250); ctx.scale(k, k); ctx.globalAlpha = clamp01(fxA * 2.2);
    txt(banner, 0, 0, 54, '#ff9f1c'); txt(`LEVEL ${level + 1}`, 0, 34, 22, '#2b2d42'); ctx.restore(); ctx.globalAlpha = 1;
  }
  if (fog > 0 && state !== 'menu') {
    // punishment fog: hides the top of the field, thicker with every pause
    const fy = Math.min(BY - 110, (BY - 60) * Math.min(.88, .3 * fog + .15)), fg = ctx.createLinearGradient(0, 0, 0, fy + 90);
    fg.addColorStop(0, 'rgba(226,220,210,1)'); fg.addColorStop(fy / (fy + 90), 'rgba(226,220,210,1)'); fg.addColorStop(1, 'rgba(226,220,210,0)');
    ctx.fillStyle = fg; ctx.fillRect(-20, -20, W + 40, fy + 110);
    ctx.fillStyle = 'rgba(226,220,210,.7)';
    for (let i = 0; i < 7; i++) { const x = ((i * 97 + t * 18) % (W + 160)) - 80; ctx.beginPath(); ctx.arc(x, fy + 30 + Math.sin(t + i) * 12, 46 + (i % 3) * 14, 0, 7); ctx.fill(); }
  }
  if (state === 'play' && resumeT > 0) { ctx.fillStyle = 'rgba(244,239,230,.35)'; ctx.fillRect(0, 0, W, H); txt(Math.ceil(resumeT) + '', W / 2, H * .45, 120, '#ff6b81'); txt('get ready', W / 2, H * .45 + 44, 22, 'rgba(43,45,66,.6)'); }
  floaters.forEach(f => { ctx.globalAlpha = f.life; txt(f.txt, f.x, f.y, 26, f.col); }); ctx.globalAlpha = 1;

  if (state === 'play') {
    txt(score + '', W / 2, 92, 72, 'rgba(43,45,66,.9)');
    txt('LEVEL ' + (level + 1) + '  ·  ' + NAMES[bucket()].toUpperCase(), W / 2, 122, 16, 'rgba(43,45,66,.55)');
    if (combo > 1) txt('x' + combo, W / 2, 160, 28, '#ff9f1c');
    // countdown to the next speed-up
    ctx.fillStyle = 'rgba(43,45,66,.12)'; ctx.beginPath(); ctx.roundRect(W / 2 - 90, 20, 180, 8, 4); ctx.fill();
    ctx.fillStyle = '#2ec4d6'; ctx.beginPath(); ctx.roundRect(W / 2 - 90, 20, 180 * clamp01(levelT / LEVEL_TIME), 8, 4); ctx.fill();
  }
  ctx.restore();
}

let last = performance.now();
(function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
syncDiffUI(); show('#menu', true);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && resumeT <= 0) { pauseGame(); fog = Math.max(0, fog - 1); } }); // leaving the app: pause, but the resume fog cancels out
</script>
</body>
